<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>行きたいリスト</title>
<!--
  🔖 行きたいリスト（保存したお店）＝案B・LIFFページ
  ・データ：GAS action=saved_list（saved_api.js / handleSavedList_）。
  ・速度：前回分を先に出す（localStorage）→裏で最新取得（ロゴ帳・旅の記録と同じ体感）。
  ・★このページ専用 LIFF_ID は本番アップ時に発行。未発行の間は ?userId= で確認可。
-->
<style>
  *{box-sizing:border-box}
  :root{--brand-base:#CB7B68;--brand-deep:#C04A55;--green:#2B5D4F;--state-done:#2F7A57;
    --paper:#F4EADD;--bg:#FFFFFF;--ink:#221C1A;--ink-sub:#6E655E;--line:#DDD6CE;--empty:#E7DCC7}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
  .bar{background:var(--green);color:#fff;padding:13px 16px;font-size:17px;font-weight:800;position:sticky;top:0;z-index:5}
  #status{text-align:center;padding:80px 20px;color:var(--ink-sub);font-size:14px}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .wrap{max-width:520px;margin:0 auto;padding:12px 12px 40px}
  .lead{font-size:12px;color:var(--ink-sub);margin:2px 4px 12px;line-height:1.7}
  /* ロースター一覧（発見地図 discover.html）と同じ寸法に合わせる＝左写真132×124・地色ベージュ・余白10/12・角丸14 */
  .card{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:11px}
  .card .pho{width:132px;min-height:124px;flex:none;background:linear-gradient(135deg,#c3a57c,#7c6448);
    display:flex;align-items:center;justify-content:center;color:#fff8ee;font-size:26px;font-weight:900;overflow:hidden}
  .card .pho img{width:100%;height:100%;object-fit:cover}
  .card .in{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column}
  .card .pref{font-size:11px;color:var(--ink-sub);font-weight:700}
  .card .nm{font-size:15px;font-weight:800;color:var(--ink);line-height:1.3;margin-top:1px}
  .card .ro{font-size:11.5px;color:var(--ink-sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .cp{font-size:11.5px;color:var(--green);line-height:1.5;margin:5px 0 8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .btns{display:flex;gap:8px;align-items:center;margin-top:auto}
  .card .go{flex:1;text-align:center;background:var(--brand-deep);color:#fff;font-weight:800;font-size:13px;
    border-radius:10px;padding:9px;text-decoration:none;box-shadow:0 3px 8px rgba(192,74,85,.22)}
  .card .see{flex:0 0 auto;color:var(--green);font-weight:700;font-size:12.5px;text-decoration:underline;padding:9px 4px;cursor:pointer}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-sub)}
  .empty .big{font-size:15px;color:var(--ink);font-weight:800;margin-bottom:8px}
  .empty a{display:inline-block;margin-top:14px;background:var(--brand-deep);color:#fff;font-weight:800;
    border-radius:11px;padding:12px 22px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="bar">行きたいリスト</div>
<div id="status"><div class="spin"></div>読み込んでいます…</div>
<div id="main" class="wrap hidden">
  <div class="lead">気になって保存したお店。次の一歩は、行き方をひらくところから。</div>
  <div id="list"></div>
</div>
<div id="empty" class="empty hidden">
  <div class="big">まだ保存したお店がありません</div>
  <div>発見地図で気になるお店を見つけて、<br>「行きたいに保存」してみましょう。</div>
  <a id="toDiscover">発見地図をひらく</a>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4ZUF9vdBoIz34-NgD927HpzQTjbD8xdK3XZ7hD1_X_5ZAHgTvmK08uB6bzB_MQByV/exec";
  const SAVED_LIFF_ID = "2008851980-XXXXXXXX"; // ★TODO：本番アップ時に専用LIFF ID発行→差替。未発行中は ?userId= で確認
  const DISCOVER_LIFF_ID = "2008851980-9MKW9F8W";
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let _started = "";

  function cardHtml(s){
    const initial = esc((s.name||"?").slice(0,2));
    // 左写真＝外観(店舗写真 s.photo)。無ければ頭文字を載せたグラデ地（一覧と同じ考え方）。
    const pho = s.photo
      ? '<img src="'+esc(s.photo)+'" alt="" onerror="this.parentNode.innerHTML=\''+initial+'\'">'
      : initial;
    const go = s.mapUrl
      ? '<a class="go" href="'+esc(s.mapUrl)+'" target="_blank" rel="noopener">行き方を見る</a>'
      : '<a class="go" href="https://liff.line.me/'+DISCOVER_LIFF_ID+'">お店をひらく</a>';
    const ro = s.roaster ? '<div class="ro">'+esc(s.roaster)+'</div>' : '';
    const cp = s.copy ? '<div class="cp">'+esc(s.copy)+'</div>' : '<div style="flex:1"></div>';
    return '<div class="card">'+
      '<div class="pho">'+pho+'</div>'+
      '<div class="in">'+
        '<div class="pref">'+esc(s.place||s.pref||"")+'</div>'+
        '<div class="nm">'+esc(s.name)+'</div>'+ ro + cp +
        '<div class="btns">'+go+'<a class="see" href="shop.html?shop='+encodeURIComponent(s.id)+'">お店を見る</a></div>'+
      '</div>'+
    '</div>';
  }

  function render(d){
    const shops = Array.isArray(d.shops)? d.shops : [];
    if (!shops.length){
      $("status").classList.add("hidden"); $("main").classList.add("hidden");
      $("empty").classList.remove("hidden");
      return;
    }
    $("list").innerHTML = shops.map(cardHtml).join("");
    $("status").classList.add("hidden"); $("empty").classList.add("hidden");
    $("main").classList.remove("hidden");
  }

  async function loadData(userId){
    try{
      const res = await fetch(GAS_URL + "?action=saved_list&userId=" + encodeURIComponent(userId) + "&_=" + Date.now());
      const d = await res.json();
      if (_started && userId !== _started) return;
      if (d && d.ok){
        render(d);
        try{ localStorage.setItem("jcj_saved_"+userId, JSON.stringify(d)); }catch(e){}
      } else if ($("main").classList.contains("hidden") && $("empty").classList.contains("hidden")){
        $("status").textContent = "読み込みに失敗しました。電波の良い場所でお試しください。";
      }
    }catch(e){
      if ($("main").classList.contains("hidden") && $("empty").classList.contains("hidden"))
        $("status").textContent = "通信エラーが起きました。電波の良い場所でお試しください。";
    }
  }

  function start(userId){
    if(!userId){ $("status").textContent = "ユーザー情報が取得できませんでした。"; return; }
    if(_started === userId) return;
    _started = userId;
    try{ localStorage.setItem("jcj_uid", userId); }catch(e){}
    $("toDiscover").href = "https://liff.line.me/" + DISCOVER_LIFF_ID;
    try{ const prev = localStorage.getItem("jcj_saved_"+userId); if(prev){ render(JSON.parse(prev)); } }catch(e){}
    loadData(userId);
  }

  async function main(){
    const qUser = new URLSearchParams(location.search).get("userId");
    if (qUser){ start(qUser.trim()); return; }
    let cachedUid = ""; try{ cachedUid = localStorage.getItem("jcj_uid")||""; }catch(e){}
    if (cachedUid){ start(cachedUid); }
    try{
      await liff.init({ liffId: SAVED_LIFF_ID });
      if (!liff.isLoggedIn()){ liff.login(); return; }
      const prof = await liff.getProfile();
      if (prof && prof.userId && prof.userId !== cachedUid){ _started=""; start(prof.userId); }
    }catch(e){
      if ($("main").classList.contains("hidden") && $("empty").classList.contains("hidden"))
        $("status").textContent = "ログインの確認中に問題が起きました。アプリを開き直してください。";
    }
  }
  main();
</script>
</body>
</html>
