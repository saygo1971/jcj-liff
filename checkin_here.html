<!-- 📍 JCJ いまいるお店でチェックイン（リッチメニューから1タップで開く画面・2026-09-12）
     設計＝docs/2026-09-12_GPSチェックイン_設計骨子_v2.md ＋ 3回目審査（眠りロースターを起こす）
     ★お店は指定しない。位置から1店だけ特定する。該当は常に0店か1店（最短の店間距離427m・半径150m）。
     ★関門0＝位置は「その場で取り直す・高精度」。maximumAge:60000 は41秒後に前回と同じ座標を返すことを
       実測済み（2026-09-12）＝古い位置の使い回し。ここを緩めると半径を何mにしても判定が成立しない。
     ★弾いてもお客さまは何も失わない（プレートが残っている）＝2026-08の事故とは条件が正反対。 -->
<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>いまいるお店でチェックイン</title>
<style>
  :root{ --brand-deep:#1F3A2E; --bg:#F8F4F0; --ink:#2A2A2A; --sub:#6B6B6B; --line:#E2DAD2; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  .bar{background:var(--brand-deep);color:#fff;padding:13px 16px;font-weight:800;font-size:15px}
  .wrap{padding:18px 16px;max-width:480px;margin:0 auto}
  .load{text-align:center;padding:48px 0;color:var(--sub);font-size:13.5px;line-height:2}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand-deep);
        border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px}
  .t{text-align:center;font-size:17px;font-weight:800;line-height:1.5}
  .shop{text-align:center;font-size:20px;font-weight:800;margin-top:10px}
  .pref{text-align:center;font-size:12px;color:var(--sub);margin-top:3px}
  .m{font-size:12.5px;color:var(--sub);line-height:1.9;margin-top:12px}
  .go{display:block;width:100%;margin:16px 0 0;padding:16px;border:0;border-radius:12px;
      background:var(--brand-deep);color:#fff;font-weight:800;font-size:16px;text-align:center}
  .go:disabled{opacity:.55}
  .mile{text-align:center;margin-top:14px}
  .mile .n{font-size:34px;font-weight:800;color:var(--brand-deep);line-height:1.1}
  .mile .l{font-size:12px;color:var(--sub)}
  .plate{width:152px;margin:14px auto 0;background:#fff;border:1px solid #D8CFC4;border-radius:7px;
         padding:13px 10px;text-align:center}
  .plate .br{font-size:9.5px;color:var(--brand-deep);font-weight:800;letter-spacing:.06em}
  .plate .lg{width:56px;height:56px;border-radius:50%;background:var(--brand-deep);margin:9px auto 0;
             display:flex;align-items:center;justify-content:center;overflow:hidden}
  .plate .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
  .plate .cp{font-size:11px;color:var(--brand-deep);font-weight:800;margin-top:9px}
  .plate .qr{width:40px;height:40px;margin:8px auto 0;
             background:repeating-conic-gradient(var(--brand-deep) 0% 25%,#fff 0% 50%) 50%/8px 8px;
             border:2px solid #fff;outline:1px solid #D8CFC4}
  .where{font-size:10.5px;color:#8A8A8A;text-align:center;margin-top:9px;line-height:1.6}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head><body>

<div class="bar">いまいるお店でチェックイン</div>
<div class="wrap">
  <div id="load" class="load"><div class="spin"></div>いまいる場所を確認しています…</div>
  <div id="body" style="display:none"></div>
</div>

<script>
  // ★オーナーのLINE Developers Console作業が必要：この画面用のLIFFを新規発行してIDを入れる
  var LIFF_ID = "PUT_CHECKIN_HERE_LIFF_ID";
  var GAS_URL = "https://script.google.com/macros/s/AKfycbx4ZUF9vdBoIz34-NgD927HpzQTjbD8xdK3XZ7hD1_X_5ZAHgTvmK08uB6bzB_MQByV/exec"; // テストGAS
  var $=function(i){return document.getElementById(i);};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  var USER_ID="";

  // プレートの絵。店が分からないときは JCJ のマークだけ（★壊れた画像の枠は出さない）
  function plate(spotId, name){
    var lg = spotId
      ? '<img src="https://japancoffeejourney.com/jcj_passport_img/shop/'+encodeURIComponent(spotId)
        +'/logo.png" alt="" onerror="this.parentNode.textContent=\'JCJ\';this.parentNode.style.color=\'#fff\';this.parentNode.style.fontWeight=\'800\'">'
      : '<span style="color:#fff;font-weight:800;font-size:13px">JCJ</span>';
    return '<div class="plate"><div class="br">JAPAN COFFEE JOURNEY</div>'
      + '<div class="lg">'+lg+'</div>'
      + '<div class="cp">来店を記録する</div><div class="qr"></div></div>'
      + '<div class="where">レジ横や展示物があるエリアなどに置かれています。</div>';
  }
  function ng(title, msg, spotId){
    $("load").style.display="none"; $("body").style.display="";
    $("body").innerHTML='<div class="card"><div class="t">'+title+'</div>'
      + '<div class="m">'+msg+'</div>' + plate(spotId||"") + '</div>';
  }

  // ★関門0：その場で取り直す・高精度
  function pos(){
    return new Promise(function(res){
      if(!navigator.geolocation){ res({geo:"unsupported"}); return; }
      navigator.geolocation.getCurrentPosition(
        function(p){ res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}); },
        function(e){ res({geo:(e&&e.code===1)?"denied":((e&&e.code===3)?"timeout":"unavailable")}); },
        { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
      );
    });
  }

  function done(r){
    $("load").style.display="none"; $("body").style.display="";
    $("body").innerHTML='<div class="card">'
      + '<div class="t">お店に着いたことを、確認しました</div>'
      + '<div class="shop">'+esc(r.shopName)+'</div>'
      + (r.alreadyToday
          ? '<div class="m" style="text-align:center">今日はすでに記録ずみです。</div>'
          : '<div class="mile"><div class="n">+'+(r.earnedMile||0)+'</div><div class="l">旅マイル　　合計 '+(r.newTotal||0)+' マイル</div></div>')
      + '</div>';
  }

  // ② お店を見せて、押されて初めて記録する（★確認の間を作る）
  function confirmShop(w, geo){
    $("load").style.display="none"; $("body").style.display="";
    $("body").innerHTML='<div class="card">'
      + '<div class="t">このお店にいますか？</div>'
      + '<div class="shop">'+esc(w.shopName)+'</div>'
      + '<div class="pref">'+esc(w.pref||"")+'</div>'
      + '<button class="go" id="ok">チェックインする</button>'
      + '<div class="where" style="margin-top:10px">違うお店のときは、お店のチェックインプレートにスマホをかざしてください</div></div>';
    $("ok").onclick=async function(){
      var b=$("ok"); if(b.disabled) return; b.disabled=true; b.textContent="記録しています…";
      var q=new URLSearchParams({action:"checkin_gps_do",userId:USER_ID,spot:w.spotId,_:Date.now()});
      q.set("lat",geo.lat); q.set("lng",geo.lng); q.set("acc",geo.acc);   // ★同じ位置を使う（取り直さない）
      try{
        var r=await (await fetch(GAS_URL+"?"+q.toString())).json();
        if(r&&r.ok){ r.shopName=r.shopName||w.shopName; done(r); return; }
        fail((r&&r.error)||"failed", w.spotId);
      }catch(e){ ng("通信できませんでした","電波の良い場所で、もう一度お試しください。",w.spotId); }
    };
  }

  function fail(e, spotId){
    if(e==="no_geo")             ng("いまの場所が確認できませんでした","お店に置いてある<b>このチェックインプレート</b>にスマホをかざすと、そのままチェックインできます。マイルはそのまま受け取れます。",spotId);
    else if(e==="acc_too_large") ng("場所をうまく読み取れませんでした","お店の中は電波が弱いことがあります。<b>このチェックインプレート</b>にスマホをかざしてください。マイルはそのまま受け取れます。",spotId);
    else if(e==="no_shop_here")  ng("この近くに、JCJのお店が見つかりませんでした","お店の中にいる場合は、<b>このチェックインプレート</b>を探して、スマホをかざしてください。",spotId);
    else if(e==="too_far")       ng("お店の近くにいることが確認できませんでした","お店に着いてから、もう一度どうぞ。<b>このチェックインプレート</b>にスマホをかざしてもチェックインできます。",spotId);
    else if(e==="ambiguous")     ng("近くに複数のお店があります","<b>このチェックインプレート</b>にスマホをかざすと、お店を間違えずにチェックインできます。",spotId);
    else if(e==="not_registered")ng("はじめに登録が必要です","JCJパスポートに登録すると、この記録が残せます。",spotId);
    else if(e==="off")           ng("いまはご利用いただけません","お店に置いてある<b>このチェックインプレート</b>にスマホをかざすと、チェックインできます。",spotId);
    else                         ng("うまくいきませんでした","少し時間をおいて、もう一度お試しください。<b>このチェックインプレート</b>にスマホをかざしてもチェックインできます。",spotId);
  }

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
      USER_ID=(await liff.getProfile()).userId||"";
    }catch(e){
      ng("LINEの中で開いてください","このページは、LINEの下のメニューから開くとご利用いただけます。","");
      return;
    }
    // ① まず「いまどのお店にいるか」だけ聞く（★この時点では1行も記録されない）
    var g=await pos();
    var q=new URLSearchParams({action:"checkin_gps_where",userId:USER_ID,_:Date.now()});
    if(g.lat!==undefined){ q.set("lat",g.lat); q.set("lng",g.lng); q.set("acc",g.acc); }
    else { q.set("geo",g.geo||"unavailable"); }
    try{
      var w=await (await fetch(GAS_URL+"?"+q.toString())).json();
      if(w&&w.ok){ confirmShop(w,g); return; }
      fail((w&&w.error)||"failed","");
    }catch(err){
      ng("通信できませんでした","電波の良い場所で、もう一度お試しください。","");
    }
  }
  main();
</script>
</body></html>
