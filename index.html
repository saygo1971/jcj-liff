<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JCJ Passport Recording...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f4f0; color: #9f866a; }
    .loader-container { text-align: center; }
    .status-text { font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="loader-container">
    <p class="status-text">🎫 JCJパスポートに記録中...</p>
  </div>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2008851980-yhGytJRd" });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        const profile = await liff.getProfile();
        const userId = profile.userId;
        const urlParams = new URLSearchParams(window.location.search);
        const spotId = urlParams.get('spot');
        const isEvent = urlParams.get('ev');

        if (spotId) {
          const gasUrl = "https://script.google.com/macros/s/AKfycbwvdgDo_qITE4Lv6fy0CpQ1LZAmNh1d12-hJwClRBAFURARTqpDZKJsozjEu56nAriDfw/exec";
          
          // 🚀 裏側でデータを送信（awaitをつけず、止まらないようにする）
          fetch(`${gasUrl}?userId=${userId}&spot=${spotId}&ev=${isEvent || ""}`, { mode: 'no-cors' });

          // ✅ 記録後に「JCJ公式アカウントのトーク画面」へ飛ばす
          // ※これを入れることで、NTAGからでも自動的にトーク画面へ移動します
          setTimeout(() => {
            window.location.href = "https://line.me/R/oaMessage/@jcj_coffee/"; // あなたの公式アカウントのIDに合わせてください
          }, 800);

        } else {
          alert("ショップ情報が見つかりません。");
        }
      } catch (err) {
        alert("エラー詳細: " + err.message);
      }
    }
    main();
  </script>
</body>
</html>
