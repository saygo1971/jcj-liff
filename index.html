<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JCJ Passport Recording...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f4f0; color: #9f866a; }
    .loader-container { text-align: center; }
    .status-text { font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="loader-container">
    <p class="status-text">🎫 JCJパスポートに記録中...</p>
  </div>

  <script>
    async function main() {
      try {
        // 1. LIFF初期化
        await liff.init({ liffId: "2008851980-yhGytJRd" });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        // 2. ユーザーIDの取得（より確実なIDトークン方式に変更）
        const idToken = liff.getDecodedIDToken();
        const userId = idToken ? idToken.sub : null;

        if (!userId) {
          // 万が一IDトークンが取れない場合のみProfileを試す
          const profile = await liff.getProfile();
          userId = profile.userId;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const spotId = urlParams.get('spot');
        const isEvent = urlParams.get('ev');

        if (spotId && userId) {
          const gasUrl = "https://script.google.com/macros/s/AKfycbwvdgDo_qITE4Lv6fy0CpQ1LZAmNh1d12-hJwClRBAFURARTqpDZKJsozjEu56nAriDfw/exec";
          
          // 🚀 データを送信（投げっぱなし）
          fetch(`${gasUrl}?userId=${userId}&spot=${spotId}&ev=${isEvent || ""}`, { mode: 'no-cors' });

          // 3. 送信後、JCJ公式アカウントのトーク画面へ戻る
          setTimeout(() => {
            window.location.href = "https://line.me/R/oaMessage/@jcj_coffee/";
          }, 500);

        } else {
          alert("情報の取得に失敗しました。もう一度お試しください。");
        }
      } catch (err) {
        // エラーを詳細に出さず、ユーザーには「再試行」を促す（iPhone流）
        console.error(err);
        alert("接続を確認して、もう一度タップしてください。");
      }
    }
    main();
  </script>
</body>
</html>
