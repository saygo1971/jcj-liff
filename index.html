<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JCJ Checkin</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div id="status">チェックイン処理中...</div>
<script>
  const LIFF_ID = "2008851980-yhGytJRd";

  function getSpot() {
    const q = new URLSearchParams(location.search);
    const direct = (q.get("spot") || "").trim();
    if (direct) return direct;
    const stateRaw = q.get("liff.state");
    if (stateRaw) {
      const s = stateRaw.startsWith("?") ? stateRaw.slice(1) : stateRaw;
      return (new URLSearchParams(s).get("spot") || "").trim();
    }
    return "";
  }

  async function main() {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href });
      return;
    }
    const spot = getSpot();
    if (!spot) {
      document.getElementById('status').innerText = "店舗情報なし";
      return;
    }
    // トークに投稿する（これがスプレッドシートへの合図）
    await liff.sendMessages([{ type:"text", text:`#${spot}` }]);
    liff.closeWindow();
  }
  main().catch(err => { document.getElementById('status').innerText = "エラー: " + err; });
</script>
</body>
</html>
