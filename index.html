<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JCJ Passport</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="background-color:#f8f4f0; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; color:#9f866a; font-family:sans-serif;">
  <div style="text-align:center;">
    <p id="msg">お店へチェックインしています…</p>
  </div>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2008851980-yhGytJRd" });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        const profile = await liff.getProfile();
        const urlParams = new URLSearchParams(window.location.search);
        const spotId = urlParams.get('spot');

        if (spotId && profile.userId) {
          // 🚀 ここがポイント：fetchではなく「画面ごと移動」させる
          const gasUrl = "https://script.google.com/macros/s/AKfycbwvdgDo_qITE4Lv6fy0CpQ1LZAmNh1d12-hJwClRBAFURARTqpDZKJsozjEu56nAriDfw/exec";
          const finalUrl = `${gasUrl}?userId=${profile.userId}&spot=${spotId}`;
          
          window.location.href = finalUrl; 
        } else {
          document.getElementById("msg").textContent = "うまく開けませんでした。お店のQRコードから、もう一度お試しください。";
        }
      } catch (err) {
        console.log(err);
        document.getElementById("msg").textContent = "うまく開けませんでした。もう一度お試しください。";
      }
    }
    main();
  </script>
</body>
</html>
