<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JCJ - Japan Coffee Journey</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #fcfaf5; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .status-text {
      color: #8b7d6b;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="status-text" id="status">旅の記録を更新中...</div>
</div>

<script>
  const LIFF_ID = "2008851980-yhGytJRd";

  function getSpot() {
    const q = new URLSearchParams(location.search);
    const direct = (q.get("spot") || "").trim();
    if (direct) return direct;
    const stateRaw = q.get("liff.state");
    if (stateRaw) {
      let decoded = stateRaw;
      try { decoded = decodeURIComponent(stateRaw); } catch(e){}
      const s = decoded.startsWith("?") ? decoded.slice(1) : decoded;
      return (new URLSearchParams(s).get("spot") || "").trim();
    }
    return "";
  }

  async function main() {
    try {
      // 1. LIFF初期化
      await liff.init({ liffId: LIFF_ID });
      
      const spot = getSpot();

      // 2. ログインチェック
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: location.href });
        return;
      }

      if (!spot) {
        document.getElementById('status').innerText = "店舗情報が見つかりません。";
        return;
      }

      // 3. メッセージ送信（これが「通信エラー」と言われる部分）
      // ログイン直後は少し待ってから送ると安定します
      setTimeout(async () => {
        try {
          await liff.sendMessages([{ type: "text", text: `#${spot}` }]);
          // 送信成功したら即座に閉じる
          liff.closeWindow();
        } catch (err) {
          console.error(err);
          document.getElementById('status').innerText = "送信に失敗しました。LINEの権限を確認してください。";
        }
      }, 500); // 0.5秒のタメを作ることで安定させます

    } catch (error) {
      console.error(error);
      document.getElementById('status').innerText = "初期化エラーが発生しました。";
    }
  }

  main();
</script>
</body>
</html>
