<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JCJ Passport Recording...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* JCJブランドカラーに合わせたシンプルな待機画面 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f4f0; /* 落ち着いたベージュ */
      color: #9f866a; /* コーヒーブラウン */
    }
    .loader-container {
      text-align: center;
    }
    .status-text {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    /* 読み込み中のアニメーション（任意） */
    .dots:after {
      content: '.';
      animation: dots 1.5s steps(5, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
      80%, 100% { content: ''; }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <p class="status-text">🎫 JCJパスポートに記録中<span class="dots"></span></p>
  </div>

  <script>
    async function main() {
  try {
    await liff.init({ liffId: "2008851980-yhGytJRd" });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const profile = await liff.getProfile(); // ユーザーIDを取得
    const userId = profile.userId;
    const urlParams = new URLSearchParams(window.location.search);
    const spotId = urlParams.get('spot');
    const isEvent = urlParams.get('ev');

    if (spotId) {
      // 🚀 ここがポイント：メッセージ送信ではなく、GASに直接データを送る
      const gasUrl = "ここにあなたのGASウェブアプリURLを貼り付け";
      await fetch(`${gasUrl}?userId=${userId}&spot=${spotId}&ev=${isEvent || ""}`, {
        mode: 'no-cors' // GASの制約を回避
      });

      // 完了したら無言で閉じる（iPhoneのようなスムーズさ）
      liff.closeWindow();
    } else {
      alert("ショップ情報が見つかりません。");
    }
  } catch (err) {
    console.error(err);
    alert("エラーが発生しました。");
  }
}
main();
  </script>
</body>
</html>
