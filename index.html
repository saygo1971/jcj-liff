<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JCJ Passport Recording...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f4f0; color: #9f866a; }
    .loader { text-align: center; }
  </style>
</head>
<body>
  <div class="loader">
    <p>🎫 JCJパスポートに記録中...</p>
  </div>

  <script>
    async function main() {
      // 1. LIFFの初期化 (ご自身のLIFF IDに書き換えてください)
      await liff.init({ liffId: "2008851980-yhGytJRd" });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      // 2. URLパラメータから 'spot' (SPOTID) を取得
      const urlParams = new URLSearchParams(window.location.search);
      const spotId = urlParams.get('spot');

      if (spotId) {
        try {
          // 3. トークルームに演出用のメッセージを送信
          await liff.sendMessages([
            {
              type: 'text',
              text: '🎫 JCJパスポートに記録中... (ID: ' + spotId + ')'
            }
          ]);
          // 4. 送信成功したらLIFFウィンドウを閉じる
          liff.closeWindow();
        } catch (error) {
          console.error("記録に失敗しました:", error);
          alert("通信エラーが発生しました。もう一度お試しください。");
        }
      } else {
        alert("ショップ情報が見つかりません。");
      }
    }

    main();
  </script>
</body>
</html>
