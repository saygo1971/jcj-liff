<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JCJ - Japan Coffee Journey</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 画面のデザイン設定 */
    body {
      margin: 0;
      background-color: #fcfaf5; /* 温かみのあるカフェカラー */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }
    .container {
      text-align: center;
    }
    .status-text {
      color: #8b7d6b;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.1em;
    }
    /* ローディング演出（小さなドットのアニメーション） */
    .loading-dots:after {
      content: ' .';
      animation: dots 1s steps(5, end) infinite;
    }
    @keyframes dots {
      0%, 20% { color: rgba(0,0,0,0); text-shadow: .3em 0 0 rgba(0,0,0,0), .6em 0 0 rgba(0,0,0,0); }
      40% { color: #8b7d6b; text-shadow: .3em 0 0 rgba(0,0,0,0), .6em 0 0 rgba(0,0,0,0); }
      60% { text-shadow: .3em 0 0 #8b7d6b, .6em 0 0 rgba(0,0,0,0); }
      80%, 100% { text-shadow: .3em 0 0 #8b7d6b, .6em 0 0 #8b7d6b; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="status-text">旅の記録を更新中<span class="loading-dots"></span></div>
</div>

<script>
  const LIFF_ID = "2008851980-yhGytJRd";

  // URLから店舗ID（spot）を抽出する関数
  function getSpot() {
    const q = new URLSearchParams(location.search);
    const direct = (q.get("spot") || "").trim();
    if (direct) return direct;

    const stateRaw = q.get("liff.state");
    if (stateRaw) {
      let decoded = stateRaw;
      try { decoded = decodeURIComponent(stateRaw); } catch(e){}
      const s = decoded.startsWith("?") ? decoded.slice(1) : decoded;
      return (new URLSearchParams(s).get("spot") || "").trim();
    }
    return "";
  }

  async function main() {
    // 1. LIFFの初期化
    await liff.init({ liffId: LIFF_ID });
    
    // 2. 店舗情報を取得（ログイン前に確保しておくのがコツ）
    const spot = getSpot();

    // 3. ログインチェック
    if (!liff.isLoggedIn()) {
      // spot情報を含んだ現在のURL（location.href）を維持してログイン
      liff.login({ redirectUri: location.href });
      return;
    }

    // 4. 店舗情報がない場合の処理
    if (!spot) {
      document.querySelector('.status-text').innerText = "店舗情報が見つかりません。";
      return;
    }

    // 5. 裏側でLINEメッセージを送信して閉じる
    try {
      // ユーザーの代わりに「#店舗ID」を送信
      await liff.sendMessages([{ type:"text", text:`#${spot}` }]);
      
      // 成功したら、ほんの少し余韻（0.3秒）をおいて閉じる
      setTimeout(() => {
        liff.closeWindow();
      }, 300);
      
    } catch (error) {
      console.error(error);
      document.querySelector('.status-text').innerText = "通信エラーが発生しました。";
    }
  }

  main().catch(err => {
    console.error(err);
  });
</script>
</body>
</html>
