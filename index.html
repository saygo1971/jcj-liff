<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JCJ Passport Recording...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f4f0; color: #9f866a; }
    .loader-container { text-align: center; }
    .status-text { font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="loader-container">
    <p class="status-text">🎫 JCJパスポートに記録中...</p>
    <p id="debug-info" style="font-size: 10px; color: #ccc; margin-top: 10px;"></p>
  </div>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2008851980-yhGytJRd" });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        // 1. ユーザーIDの取得
        const profile = await liff.getProfile();
        const userId = profile.userId;
        
        const urlParams = new URLSearchParams(window.location.search);
        const spotId = urlParams.get('spot');
        const isEvent = urlParams.get('ev');

        if (spotId && userId) {
          const gasUrl = "https://script.google.com/macros/s/AKfycbwvdgDo_qITE4Lv6fy0CpQ1LZAmNh1d12-hJwClRBAFURARTqpDZKJsozjEu56nAriDfw/exec";
          const finalUrl = `${gasUrl}?userId=${userId}&spot=${spotId}&ev=${isEvent || ""}`;

          // 2. データの送信（送信完了を待ってから次に進むように変更して確実性を上げます）
          await fetch(finalUrl, { mode: 'no-cors' });

          // 3. 成功演出として少し待ってから、公式アカウントの「トーク画面」へ移動
          // URLの末尾から「/」を消し、最も安定した形式に変更しました
          setTimeout(() => {
            liff.openWindow({
              url: "https://line.me/R/ti/p/@jcj_coffee", 
              external: false
            });
            // 補助として現在の窓も閉じる
            liff.closeWindow();
          }, 500);

        } else {
          document.getElementById('debug-info').innerText = "ID取得エラー";
        }
      } catch (err) {
        document.getElementById('debug-info').innerText = "エラー: " + err.message;
      }
    }
    main();
  </script>
</body>
</html>
