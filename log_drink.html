<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>/* cache-buster-jcj: LINE/webviewのキャッシュ対策 */if(location.search.indexOf("t=")<0){location.replace(location.pathname+(location.search?location.search+"&":"?")+"t="+Date.now());}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>今日の一杯</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* JCJ 新トンマナ8色（2026-08-31・全社トークン。ピンク=これから起こす／グリーン=終わったこと） */
  *{box-sizing:border-box}
  :root{--brand-base:#CB7B68;--brand-deep:#C04A55;--state-done:#2F7A57;--state-error:#C0392B;
    --paper:#F4EADD;--bg:#FFFFFF;--ink:#221C1A;--ink-sub:#6E655E;--line:#DDD6CE;--done-tint:#E7F0EB;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased}
  .bar{background:var(--brand-base);color:#fff;padding:13px 16px;font-size:18px;font-weight:800;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  .bar .rt{font-size:11px;font-weight:700;background:rgba(255,255,255,.95);color:var(--brand-deep);
    padding:3px 9px;border-radius:8px}
  .wrap{max-width:460px;margin:0 auto;padding:16px 16px 40px}
  .hidden{display:none!important}
  #status{text-align:center;padding:80px 20px;color:var(--ink-sub);font-size:14px}
  .chk{background:var(--done-tint);color:var(--state-done);font-size:12.5px;font-weight:700;border-radius:10px;
    padding:9px 11px;display:flex;gap:6px;align-items:center;margin-bottom:14px}
  /* ★2026-10-05 コーヒー日記（審査会A-1）：飲んだ場所を自分で選ぶ所 */
  .chkedit{margin-left:auto;background:#fff;border:1px solid var(--state-done);color:var(--state-done);
    font-size:11.5px;font-weight:800;border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit}
  .picker{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:var(--paper)}
  .picker .sec{margin-top:0}
  .pick{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:12px 13px;font-size:14px;font-weight:700;color:var(--ink);
    cursor:pointer;margin-bottom:8px;font-family:inherit}
  .pick.sel{border-color:var(--brand-deep);color:var(--brand-deep)}
  .picklist{max-height:240px;overflow-y:auto;margin:4px 0 8px}
  .picklist .row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:13.5px;color:var(--ink);cursor:pointer;margin-bottom:6px}
  .picklist .row .d{font-size:11px;color:var(--ink-sub);margin-top:2px}
  .pickother{display:flex;gap:7px;margin:4px 0 8px}
  .pickother input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;
    font-family:inherit;background:var(--bg);color:var(--ink)}
  .pickok{background:var(--brand-deep);color:#fff;border:0;border-radius:10px;padding:10px 14px;
    font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .pickmsg{font-size:12px;color:var(--ink-sub);line-height:1.6;min-height:16px}
  .store{font-size:19px;font-weight:800;margin:2px 0 1px;color:var(--ink)}
  .store-pl{font-size:12.5px;color:var(--ink-sub);margin-bottom:16px}
  .q{font-size:15px;font-weight:800;margin:0 0 4px;color:var(--ink)}
  .sub{font-size:12px;color:var(--ink-sub);margin:0 0 14px;line-height:1.7}
  .sec{font-size:13px;font-weight:800;margin:16px 0 9px;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 15px;
    font-size:13.5px;color:var(--ink);cursor:pointer;user-select:none;transition:.12s}
  .chip.sel{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff;font-weight:700}
  .more{margin:20px 0 0;border-top:1px solid var(--line);padding-top:14px;
    display:flex;justify-content:space-between;align-items:center;font-size:13.5px;
    font-weight:700;color:var(--ink);cursor:pointer;user-select:none}
  .more .chev{color:var(--ink-sub);font-size:12.5px}
  .detail{margin-top:12px}
  /* ★2026-10-06 オーナー指示：おうちで淹れたときだけ出す「湯温」。 */
  .tempbox{display:flex;align-items:center;gap:8px}
  .tempbox input{width:112px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;
    font-family:inherit;background:var(--bg);color:var(--ink)}
  .tempunit{font-size:14px;font-weight:800;color:var(--ink-sub)}
  .brewnote{font-size:11.5px;color:var(--ink-sub);margin:-4px 0 10px 94px;line-height:1.6}
  /* ★2026-10-06 選ぶ所は全部プルダウン。1項目1行・左に項目名。 */
  .row{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .row .lb{width:84px;flex:none;font-size:13px;font-weight:800;color:var(--ink)}
  .row select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 10px;
    font-size:15px;font-family:inherit;background:var(--bg);color:var(--ink)}
  .row input[type=number]{width:96px;border:1px solid var(--line);border-radius:10px;padding:11px 10px;
    font-size:15px;font-family:inherit;background:var(--bg);color:var(--ink)}
  textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;
    font-family:inherit;resize:vertical;min-height:64px;background:var(--bg);color:var(--ink)}
  .btn{background:var(--brand-deep);color:#fff;text-align:center;font-weight:800;font-size:15.5px;
    border-radius:12px;padding:14px;box-shadow:0 4px 10px rgba(192,74,85,.28);border:0;width:100%;cursor:pointer;margin-top:26px}
  .btn:disabled{opacity:.55}
  .later{display:block;text-align:center;color:var(--ink-sub);font-size:13px;margin-top:14px;
    font-weight:600;text-decoration:none}
  .err{color:var(--state-error);font-size:12.5px;margin-top:10px;text-align:center;min-height:16px}
  .tiny{text-align:center;color:var(--ink-sub);font-size:10.5px;margin-top:16px;line-height:1.7}
  /* 写真を追加（任意） */
  .photobox{margin-top:18px}
  .photobtn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--brand-deep);color:var(--brand-deep);
    font-weight:800;font-size:14px;border-radius:11px;padding:11px 18px;cursor:pointer}
  .photobtn:before{content:"＋";font-size:16px;font-weight:900}
  .photoprev{position:relative;display:inline-block;margin-top:10px}
  .photoprev img{max-width:180px;max-height:180px;border-radius:12px;border:1px solid var(--line);display:block}
  .photox{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;background:#221C1A;color:#fff;
    border:2px solid #fff;font-size:15px;line-height:1;cursor:pointer}
  .photonote{font-size:11.5px;color:var(--ink-sub);margin-top:9px;line-height:1.6}
  #done{text-align:center;padding:70px 24px}
  #done .emo{font-size:44px}
  #done .t{font-size:19px;font-weight:800;margin:14px 0 8px;color:var(--state-done)}
  #done .msg{font-size:13.5px;color:var(--ink-sub);line-height:1.8}
  /* 旅の記録を見る＝副（緑枠）。紹介を主役(テラコッタ)にするためトンマナ上こちらは枠線に。 */
  #done .goHist{display:inline-block;margin-top:20px;background:#fff;color:var(--state-done);border:1.5px solid var(--state-done);
    text-decoration:none;font-weight:800;border-radius:12px;padding:11px 22px;font-size:14px}
  /* 友だちに紹介する＝主役（テラコッタ・1画面1つ） */
  #done .refWrap{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line,#DDD6CE)}
  #done .refBtn{display:inline-block;background:var(--brand-deep);color:#fff;text-decoration:none;font-weight:800;
    border-radius:12px;padding:13px 26px;font-size:15px;box-shadow:0 4px 10px rgba(192,74,85,.25)}
  #done .refTiny{font-size:11px;color:var(--ink-sub,#6E655E);margin-top:9px}
</style>
</head>
<body>
<div class="bar"><span>今日の一杯</span></div>

<div id="status">読み込んでいます…</div>

<div id="main" class="wrap hidden">
  <!-- ★2026-10-05 コーヒー日記（審査会A-1・条件1）：飲んだ場所を自分で選べるようにした。
       チェックインのあと・旅の記録から来たときは、いままでと同じ見た目（お店が決まっている）。
       「かえる」を押したときだけ下の選ぶ所がひらき、お店の一覧も押したときだけ読む。 -->
  <div class="chk" id="chkLine">✓ <span id="chkStore">お店</span> に来ました<button type="button" class="chkedit hidden" id="chkEdit">かえる</button></div>

  <div class="picker hidden" id="picker">
    <div class="sec">どこで飲みましたか？</div>
    <button type="button" class="pick" id="pickHome">家で淹れた</button>
    <button type="button" class="pick" id="pickVisited">行ったことのあるお店からえらぶ</button>
    <button type="button" class="pick" id="pickOther">その他（お店の名前を書く）</button>
    <div class="picklist hidden" id="pickList"></div>
    <div class="pickother hidden" id="pickOtherBox">
      <input type="text" id="otherName" maxlength="40" placeholder="お店の名前">
      <button type="button" class="pickok" id="otherOk">これにする</button>
    </div>
    <div class="pickmsg" id="pickMsg"></div>
  </div>

  <div class="q" id="qHead">今日の一杯は？</div>
  <div class="sub" id="subLine">まだ香りが残っているうちに。<br>あとで見返すと、自分の好みが見えてきます。</div>

  <!-- ★2026-10-06 オーナー指摘「ボタンだらけで何を押せばいいか分からない」。
       ⇒ 選ぶ所は【全部プルダウン】に揃えた。1項目1行・左に項目名・どれも任意。
       ★おうちのときは 抽出ツール→挽き目→湯温 の3行が増える（順番はオーナー指定）。
       ★精製方法は折りたたみから出した＝プルダウン1行なら場所を取らないため。 -->
  <div class="row"><span class="lb">飲みもの</span><select id="selDrink"></select></div>
  <div class="row"><span class="lb">生産国</span><select id="selCountry"></select></div>
  <div class="row"><span class="lb">精製方法</span><select id="selProcess"></select></div>

  <div class="homeonly hidden" id="homeOnly">
    <div class="row"><span class="lb">抽出ツール</span><select id="selBrew"></select></div>
    <div class="brewnote" id="brewNote"></div>
    <div class="row"><span class="lb">挽き目</span><select id="selGrind"></select></div>
    <div class="row"><span class="lb">湯温</span><input type="number" id="temp" inputmode="numeric" min="1" max="100" step="1" placeholder="92"><span class="tempunit">℃</span></div>
  </div>

  <div class="more" id="moreToggle"><span>ひとことメモを書く</span><span class="chev" id="moreChev">＋ ひらく ▾</span></div>
  <div class="detail hidden" id="detail">
    <textarea id="memo" placeholder="香り・味わい・気づいたこと など"></textarea>
  </div>

  <!-- 写真を追加（任意）＝③体験。撮る/選ぶ→端末側で縮小→プレビュー。保存先(Drive等)はアカウント確定後に結線。 -->
  <div class="photobox" id="photoBox">
    <div class="sec">写真を追加（任意）</div>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <button type="button" class="photobtn" id="photoBtn">写真を選ぶ・撮る</button>
    <div class="photoprev hidden" id="photoPrev"><img id="photoImg" alt=""><button type="button" class="photox" id="photoClear" aria-label="写真を外す">×</button></div>
    <!-- 撮る直前が一番効くタイミング＝オーナー指定の文言(一字一句)を短く1行。全文は「遊び方・使い方」ページ。 -->
    <div class="photonote">写真を撮る前に、お店の方にご確認ください。</div>
  </div>

  <button class="btn" id="submitBtn">今日の一杯を残す</button>
  <a class="later" id="laterLink" href="#">あとで</a>
  <div class="err" id="err"></div>
  <div class="tiny">任意です</div>
</div>

<div id="done" class="hidden">
  <div class="emo">☕️</div>
  <div class="t" id="doneT">記録しました</div>
  <div class="msg" id="doneMsg">この一杯が、あなたのコーヒー日記になりました。<br>次のお店でも、ぜひ残してください。</div>
  <a class="goHist" id="goHist" href="#">コーヒー日記を見る</a>
  <!-- ③ 友だちに紹介（記録できた瞬間に・明確な文言／メリット一言） -->
  <div class="refWrap" id="refWrap">
    <a class="refBtn" id="refBtn" href="#">友だちに紹介する</a>
    <div class="refTiny">友だちが登録すると、あなたにもマイルがたまります</div>
  </div>
</div>

<script>
  // ===== 設定（テスト環境）=====
  // LIFF_ID：この記録フォーム用に LINE Developers で作成するLIFFアプリID（テストのログインチャネル 2008851980 配下）。
  //          エンドポイントURL＝ https://saygo1971.github.io/jcj-liff/log_drink.html
  const LIFF_ID = "2008851980-DMVX7HZ0"; // 今日の一杯（テスト・2026-08-31発行）
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4ZUF9vdBoIz34-NgD927HpzQTjbD8xdK3XZ7hD1_X_5ZAHgTvmK08uB6bzB_MQByV/exec";
  // 旅の記録（訪問履歴）ページのLIFF（発行後に差し替え）。未設定なら「旅の記録を見る」は非表示。
  const HISTORY_LIFF_ID = "2008851980-6s0zFwwl";
  // 友だちに紹介（シェア）LIFF＝既存の紹介シェア（テスト）。本番化時に本番SHARE_LIFF_IDへ差替。
  const SHARE_LIFF_ID = "2008851980-V8WaCaZw";
  // ============================

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let USER_ID = "";
  const SHOP_ID   = String(params.get("shop") || "").trim();
  const SHOP_NAME = String(params.get("name") || "").trim();
  const SHOP_PREF = String(params.get("pref") || "").trim();
  // ★2026-10-05：いま選ばれている場所。URLで来たときはそれが初めの値。
  //   お店の台帳に在るお店＝curShopId に店のID／家で淹れた・その他＝curShopId は空で curShopName だけ入る。
  let curShopId   = SHOP_ID;
  let curShopName = SHOP_NAME;
  const REC_DATE  = String(params.get("date") || "").trim(); // 過去の来店に足す時のみ（epoch ms）
  const IS_BACK   = REC_DATE !== "";

  // ★2026-10-06 オーナー指示：お店かうちかを選んだ時点で、選ぶ項目そのものを出し分ける。
  //   ★ドリップバッグ＝おうちだけ（お店では出てこないため）
  //   ★「わからない」＝お店だけ（ご自分で買った豆なら袋に書いてあるため）
  const DRINKS_SHOP = ["ドリップ","エスプレッソ","カフェラテ","アメリカーノ","水出し","その他"];
  const DRINKS_HOME = ["ドリップ","ドリップバッグ","水出し","エスプレッソ","カフェラテ","その他"];
  const COUNTRIES_BASE = ["エチオピア","ケニア","コロンビア","ブラジル","グアテマラ","コスタリカ","ホンジュラス","パナマ","インドネシア","ルワンダ","ブレンド","その他"];
  const PROCESSES_BASE = ["ウォッシュト","ナチュラル","ハニー","アナエロビック"];
  // ★おうちだけ。GAS側の受け取りと同じ並び（ここに無いものは台帳に入らない）
  const GRINDS   = ["細挽き","中細挽き","中挽き","中粗挽き","粗挽き"];
  const BREWS    = ["ハンドドリップ","サイフォン","エアロプレス","エスプレッソマシン"];

  const sel = { drink:"", country:"", process:"", grind:"", brew:"" };

  // ★2026-10-06 前に選んだ抽出ツールを覚えておく＝器具を変えた日だけ選び直せばよい。
  //   この端末の中だけに残る覚え書き。読めなくても画面は普通に動く。
  const BREW_KEY = "jcj_last_brew";
  function loadLastBrew(){ try { return localStorage.getItem(BREW_KEY) || ""; } catch(e){ return ""; } }
  function saveLastBrew(v){ try { localStorage.setItem(BREW_KEY, v || ""); } catch(e){} }

  // ★2026-10-06 オーナー指摘を受けて、ボタンの列をやめてプルダウンにした。
  //   場所（お店／うち）を変えるたびに中身を並べ直す。
  //   いま選ばれているものが新しい並びに無ければ、選ばれていない状態に戻す。
  //   一番上は いつも「えらぶ」＝選ばなくてよい（どれも任意）。
  function buildSelect(box, items, key){
    const el = $(box);
    if (sel[key] && items.indexOf(sel[key]) < 0) sel[key] = "";
    el.innerHTML = "";
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = "えらぶ";
    el.appendChild(blank);
    items.forEach(function(it){
      const o = document.createElement("option");
      o.value = it; o.textContent = it;
      el.appendChild(o);
    });
    el.value = sel[key] || "";
    el.onchange = function(){
      sel[key] = el.value || "";
      if (key === "brew") saveLastBrew(sel[key]);   // ★次に開いたとき最初から入っているように
    };
  }

  function showStatus(msg){ $("status").textContent = msg; $("status").classList.remove("hidden"); }

  // 写真を追加（任意）＝端末側で縮小(長辺1280/JPEG0.8)→プレビュー。縮小後データURLを window._photoData に保持。
  // ★保存(Drive等への結線)は「保存先アカウント確定＋GAS受け口配備」後に submit で送る。今はUX＋iPhone選択確認まで。
  window._photoData = "";
  function setupPhoto(){
    var inp = $("photoInput"), btn = $("photoBtn");
    if(!inp || !btn) return;
    btn.onclick = function(){ inp.click(); };
    inp.onchange = function(){
      var f = this.files && this.files[0]; if(!f) return;
      var img = new Image();
      img.onload = function(){
        var MAX = 1280, w = img.width, h = img.height;
        if (w > h && w > MAX){ h = Math.round(h*MAX/w); w = MAX; }
        else if (h >= w && h > MAX){ w = Math.round(w*MAX/h); h = MAX; }
        var c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        window._photoData = c.toDataURL("image/jpeg", 0.8);   // 縮小後(≒150-250KB)
        $("photoImg").src = window._photoData;
        $("photoPrev").classList.remove("hidden");
        btn.textContent = "写真を変える";
        try{ URL.revokeObjectURL(img.src); }catch(e){}
      };
      img.onerror = function(){ $("err").textContent = "この写真は読み込めませんでした。別の写真でお試しください。"; };
      img.src = URL.createObjectURL(f);
    };
    $("photoClear").onclick = function(){
      window._photoData = ""; inp.value = "";
      $("photoPrev").classList.add("hidden"); btn.textContent = "写真を選ぶ・撮る";
    };
  }

  // ★2026-10-05 コーヒー日記（審査会A-1）：ここから下4つが「飲んだ場所を自分で選ぶ」の動き。
  // 一番上の行の見た目を、いま選ばれている場所に合わせる。
  function paintPlace(){
    if (IS_BACK) return;                      // 過去の来店に足すときは、その日のその店で固定
    if (curShopId){
      $("chkLine").innerHTML = '✓ <span id="chkStore"></span> に来ました';
      $("chkStore").textContent = curShopName || "お店";
    } else if (curShopName){
      $("chkLine").innerHTML = '☕ <span id="chkStore"></span>';
      $("chkStore").textContent = curShopName;
    } else {
      $("chkLine").innerHTML = '☕ <span id="chkStore">どこで飲んだかをえらんでください</span>';
    }
    const b = document.createElement("button");
    b.type = "button"; b.className = "chkedit"; b.id = "chkEdit"; b.textContent = "かえる";
    b.onclick = openPicker;
    $("chkLine").appendChild(b);
    wireRef();
  }

  // 紹介のボタンは「どのお店を紹介するか」が決まるときだけ出す（家で淹れた・手入力では出さない）。
  function wireRef(){
    if (/^\d+-/.test(SHARE_LIFF_ID) && curShopId){
      $("refBtn").href = "https://liff.line.me/" + SHARE_LIFF_ID + "?shopId=" + encodeURIComponent(curShopId) + "&source=log_drink";
      $("refWrap").classList.remove("hidden");
    } else { $("refWrap").classList.add("hidden"); }
  }

  function openPicker(){ $("picker").classList.remove("hidden"); }

  // ★2026-10-06 オーナー指示：挽き目と湯温は、おうちで淹れたときだけ出す。
  //   お店が決まっている（店舗IDがある）ときは出さないし、書かれていた分も消す
  //   ＝お店の一杯に、前に打った湯温が付いてしまうのを防ぐ。
  // ★2026-10-06 オーナー指示：お店かうちかで、選ぶ項目そのものを出し分ける。
  function paintFields(){
    const isHome = !curShopId;

    // 飲みもの＝お店とうちで並びが違う（ドリップバッグはうちだけ）
    buildSelect("selDrink", isHome ? DRINKS_HOME : DRINKS_SHOP, "drink");
    // 生産国・精製方法＝「わからない」はお店のときだけ出す
    buildSelect("selCountry", isHome ? COUNTRIES_BASE : COUNTRIES_BASE.concat(["わからない"]), "country");
    buildSelect("selProcess", isHome ? PROCESSES_BASE : PROCESSES_BASE.concat(["わからない"]), "process");

    // 抽出ツール・挽き目・湯温＝うちのときだけ
    $("homeOnly").classList.toggle("hidden", !isHome);
    if (isHome){
      // ★前に選んだ抽出ツールを、最初から選ばれた状態にする（変えた日だけ選び直せばよい）
      if (!sel.brew){
        const last = loadLastBrew();
        if (BREWS.indexOf(last) >= 0) sel.brew = last;
      }
      buildSelect("selBrew", BREWS, "brew");
      buildSelect("selGrind", GRINDS, "grind");
      $("brewNote").textContent = sel.brew ? "前に選んだ器具です。変えた日だけ選び直してください。" : "";
    } else {
      sel.brew = ""; sel.grind = "";
      if ($("temp")) $("temp").value = "";
    }
  }

  // 場所を決める。shopId が空＝お店の台帳に無い場所（家で淹れた・手入力）。
  function setPlace(shopId, shopName){
    curShopId = String(shopId || "");
    curShopName = String(shopName || "").trim().slice(0, 40);
    $("picker").classList.add("hidden");
    $("pickList").classList.add("hidden");
    $("pickOtherBox").classList.add("hidden");
    $("pickMsg").textContent = "";
    $("err").textContent = "";
    paintPlace();
    paintFields();   // ★2026-10-06 場所に合わせて、選ぶ項目そのものを並べ直す
  }

  // 「行ったことのあるお店からえらぶ」＝押したときだけ読む（この画面を開くのは遅くならない）。
  let visitedLoaded = false;
  async function loadVisited(){
    $("pickList").classList.remove("hidden");
    $("pickOtherBox").classList.add("hidden");
    if (visitedLoaded) return;
    $("pickMsg").textContent = "行ったお店を読んでいます…（少し時間がかかります）";
    try {
      const res = await fetch(GAS_URL + "?action=my_history&userId=" + encodeURIComponent(USER_ID) + "&_=" + Date.now());
      const d = await res.json();
      if (!d || !d.ok) throw new Error("ng");
      // 同じお店は1つにまとめ、最後に行った日が新しい順に並べる
      const map = {};
      (d.checkins || []).forEach(function(c){
        const id = String(c.shopId || "").trim();
        if (!id) return;
        if (!map[id] || (c.ms || 0) > map[id].ms) map[id] = { id: id, name: c.shopName || "お店", ms: c.ms || 0, date: c.date || "" };
      });
      const list = Object.keys(map).map(k => map[k]).sort((a, b) => b.ms - a.ms);
      if (!list.length){
        $("pickMsg").textContent = "まだ行ったお店の記録がありません。「その他（お店の名前を書く）」からどうぞ。";
        $("pickList").classList.add("hidden");
        visitedLoaded = true;
        return;
      }
      $("pickList").innerHTML = "";
      list.forEach(function(s){
        const row = document.createElement("div");
        row.className = "row";
        const nm = document.createElement("div"); nm.textContent = s.name;
        const dt = document.createElement("div"); dt.className = "d"; dt.textContent = s.date ? ("最後に行った日 " + s.date) : "";
        row.appendChild(nm); row.appendChild(dt);
        row.onclick = function(){ setPlace(s.id, s.name); };
        $("pickList").appendChild(row);
      });
      $("pickMsg").textContent = list.length + " 軒";
      visitedLoaded = true;
    } catch(e){
      $("pickMsg").textContent = "行ったお店を読めませんでした。「その他（お店の名前を書く）」からどうぞ。";
      $("pickList").classList.add("hidden");
    }
  }

  async function submit(){
    $("err").textContent = "";
    const memo = $("memo").value.trim();
    // ★2026-10-06 湯温（おうちのときだけ出る）。お店のときは空のまま送る
    const tempVal = (!curShopId && $("temp")) ? String($("temp").value || "").trim() : "";
    // ★2026-10-05：どこで飲んだかが決まっていない記録は送らない（受け口も断る作りになっている）
    if (!curShopId && !curShopName){
      $("err").textContent = "どこで飲んだかを、上からえらんでください。";
      openPicker();
      return;
    }
    // 写真だけの記録も許可（飲みもの等が無くても写真があればOK）
    if (!sel.drink && !sel.country && !sel.process && !memo && !window._photoData && !sel.grind && !tempVal && !sel.brew){
      $("err").textContent = "飲みものか生産国を1つえらぶか、写真を追加してください。";
      return;
    }
    $("submitBtn").disabled = true; $("submitBtn").textContent = "記録中…";
    try {
      // 写真つきは「1回のやり取り」でまとめて送る＝写真保存＋記録をサーバー側で続けて処理（往復1回で速い）。
      // 写真なしは従来どおり軽いGET。
      let d;
      if (window._photoData){
        $("submitBtn").textContent = "写真つきで記録中…";
        const res = await fetch(GAS_URL + "?action=drink_log_full", {
          method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
          body: JSON.stringify({
            userId:USER_ID, shopId:curShopId, shopName:curShopName,
            drink:sel.drink, country:sel.country,
            process:sel.process, memo:memo, date:REC_DATE, photo:window._photoData,
            grind:sel.grind, temp:tempVal, brew:sel.brew       // ★2026-10-06
          })
        });
        d = await res.json();
      } else {
        const q = new URLSearchParams({
          action:"drink_log_submit", userId:USER_ID, shopId:curShopId, shopName:curShopName,
          drink:sel.drink, country:sel.country, process:sel.process, memo:memo, date:REC_DATE,
          grind:sel.grind, temp:tempVal, brew:sel.brew,         // ★2026-10-06
          photoUrl:"", _:Date.now()
        });
        const res = await fetch(GAS_URL + "?" + q.toString(), { method:"GET" });
        d = await res.json();
      }
      if (!d || !d.ok){
        $("submitBtn").disabled = false; $("submitBtn").textContent = "今日の一杯を残す";
        $("err").textContent = "記録に失敗しました。もう一度お試しください。";
        return;
      }
      // 書いた結果が返ってくる＝「◯杯目の一杯」（次も書きたくなる）
      $("doneT").textContent = IS_BACK ? "記録しました" : (d.count ? d.count + "杯目を記録しました" : "記録しました");
      // ★2026-10-06：おうちで淹れた一杯に「次のお店でも」は合わないので、言葉を変える。
      if (!curShopId){
        $("doneMsg").innerHTML = "この一杯が、あなたのコーヒー日記になりました。<br>次の一杯も、ぜひ残してください。";
      }
      $("main").classList.add("hidden");
      $("done").classList.remove("hidden");
    } catch(e){
      $("submitBtn").disabled = false; $("submitBtn").textContent = "今日の一杯を残す";
      $("err").textContent = "通信エラーが起きました。電波の良い場所でお試しください。";
    }
  }

  function closeApp(){ try{ if(liff && liff.isInClient && liff.isInClient()){ liff.closeWindow(); return; } }catch(e){} history.length>1?history.back():window.close(); }

  function wire(){
    $("chkStore").textContent = SHOP_NAME || "お店";
    // 過去の来店に足すモード（旅の記録の「記録を追加する」）＝文言を過去向けに
    if (IS_BACK){
      var dt = new Date(Number(REC_DATE));
      var ymd = isNaN(dt.getTime()) ? "" : (dt.getFullYear()+"/"+(dt.getMonth()+1)+"/"+dt.getDate());
      $("chkLine").textContent = "🗓 " + (SHOP_NAME||"お店") + (ymd ? "（"+ymd+"）" : "") + " の記録";
      $("qHead").textContent = "この日は何を飲みましたか？";
      $("subLine").textContent = "あとから思い出して残せます。";
      $("submitBtn").textContent = "この一杯を記録する";
    }
    paintFields();   // ★2026-10-06 開いた時点の場所に合わせて、選ぶ項目を並べる
    $("moreToggle").onclick = function(){
      const dt = $("detail"); const open = dt.classList.toggle("hidden") === false;
      $("moreChev").textContent = open ? "－ とじる ▴" : "＋ ひらく ▾";
    };
    $("submitBtn").addEventListener("click", submit);
    setupPhoto();
    $("laterLink").onclick = function(ev){ ev.preventDefault(); closeApp(); };
    // 旅の記録リンク（履歴LIFF未発行なら隠す）
    if (/^\d+-/.test(HISTORY_LIFF_ID) && HISTORY_LIFF_ID.indexOf("YYYYYYYY")<0){
      $("goHist").href = "https://liff.line.me/" + HISTORY_LIFF_ID;
    } else { $("goHist").classList.add("hidden"); }
    // 友だちに紹介＝既存シェアLIFF（送る側 share）へ。★shopId 必須（この店を紹介する）。shop.html と同じ付け方。
    // ★2026-10-05：選び直せるようになったので、つなぎ方は wireRef() に移した（場所を変えるたびに付け替える）。
    wireRef();
    // ★2026-10-05 コーヒー日記（審査会A-1・条件1）：飲んだ場所を自分で選ぶ。
    //   過去の来店に足すとき（旅の記録から）は、その日のその店の記録なので選び直させない。
    if (!IS_BACK){
      $("chkEdit").classList.remove("hidden");
      $("chkEdit").onclick = openPicker;
      $("pickHome").onclick    = function(){ setPlace("", "家で淹れた"); };
      $("pickVisited").onclick = function(){ loadVisited(); };
      $("pickOther").onclick   = function(){
        $("pickOtherBox").classList.remove("hidden");
        $("pickList").classList.add("hidden");
        $("pickMsg").textContent = "";
        $("otherName").focus();
      };
      $("otherOk").onclick = function(){
        const v = $("otherName").value.trim();
        if (!v){ $("pickMsg").textContent = "お店の名前を書いてください。"; return; }
        setPlace("", v);
      };
      // お店が決まっていないで開いたとき（＝家で淹れた一杯を書きに来たとき）は、選ぶ所を先にひらく
      if (!curShopId && !curShopName){ paintPlace(); openPicker(); }
    }
    $("status").classList.add("hidden");
    $("main").classList.remove("hidden");
  }

  async function main(){
    showStatus("読み込んでいます…");
    // LINE外プレビュー用フォールバック（LIFF未発行でも画面確認できる）
    const previewUid = String(params.get("uid") || "").trim();
    const liffReady = /^\d+-/.test(LIFF_ID) && LIFF_ID.indexOf("XXXXXXXX")<0;
    if (!liffReady){
      USER_ID = previewUid; // プレビューは uid 無しでもUIは動く（送信は失敗しうる）
      wire(); return;
    }
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    const profile = await liff.getProfile();
    USER_ID = profile.userId || previewUid;
    if (!USER_ID){ showStatus("ユーザー情報を取得できませんでした。"); return; }
    wire();
  }
  main().catch(err => showStatus("エラー: " + (err && err.message || String(err))));
</script>
</body>
</html>
