<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>/* cache-buster-jcj: LINE/webviewのキャッシュ対策 */if(location.search.indexOf("t=")<0){location.replace(location.pathname+(location.search?location.search+"&":"?")+"t="+Date.now());}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>旅の記録</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* JCJ 新トンマナ8色（2026-08-31・全社トークン。ピンク=これから起こす／グリーン=終わったこと） */
  *{box-sizing:border-box}
  :root{--brand-base:#CB7B68;--brand-deep:#C04A55;--state-done:#2F7A57;--state-error:#C0392B;
    --paper:#F4EADD;--bg:#FFFFFF;--ink:#221C1A;--ink-sub:#6E655E;--line:#DDD6CE;--done-tint:#E7F0EB;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
  .bar{background:#2B5D4F;color:#fff;padding:13px 16px;font-size:18px;font-weight:800;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  .bar .rt{font-size:11px;font-weight:700;background:rgba(255,255,255,.95);color:var(--brand-deep);padding:3px 9px;border-radius:8px}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 44px}
  .hidden{display:none!important}
  #status{text-align:center;padding:80px 20px;color:var(--ink-sub);font-size:14px}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand-deep);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .refresh{text-align:center;font-size:11px;color:var(--ink-sub);background:var(--paper);padding:5px 8px;border-radius:8px;margin:0 0 12px}
  .hlead{font-size:12.5px;color:var(--ink);font-weight:700;text-align:center;margin:2px 0 14px}
  .summ{display:flex;gap:8px;margin-bottom:16px}
  .summ .s{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px 4px}
  .summ .s b{display:block;font-size:22px;color:var(--ink);font-weight:900}
  .summ .s span{font-size:10.5px;color:var(--ink-sub)}
  .hrow{display:flex;flex-direction:column;gap:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}
  .hrow.recorded{border:1.5px solid var(--state-done)}
  .htop{display:flex;gap:10px}
  /* B案：記録の下に写真を大きく（投稿っぽい）・タップで拡大 */
  .hphoto{margin-top:10px;width:100%;max-height:240px;object-fit:cover;border-radius:10px;display:block;cursor:zoom-in;background:var(--paper)}
  .phbad{max-height:none;min-height:74px;object-fit:unset;cursor:default;display:flex;align-items:center;justify-content:center;color:#b05a52;font-size:12.5px;font-weight:700;border:1px dashed #e0c3bd}
  .hmemo{margin-top:10px;background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  /* 写真の拡大（ライトボックス） */
  .lightbox{position:fixed;inset:0;background:rgba(20,15,10,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px}
  .lightbox .lx{position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:20px;cursor:pointer}
  .hdate{width:66px;flex:0 0 66px;text-align:center}
  .hdate .d{font-size:11px;color:var(--ink-sub);font-weight:700}
  .hlogo{display:block;width:46px;height:46px;margin:8px auto 0;object-fit:contain}
  .hbody{flex:1;min-width:0}
  .hname{font-size:14px;font-weight:800;line-height:1.35;color:var(--ink)}
  .hpl{font-size:11px;color:var(--ink-sub);margin:1px 0 7px}
  .htags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;border-radius:8px;padding:3px 10px;font-weight:700}
  .tag.drink{background:var(--paper);color:var(--ink)}
  .tag.ctry{background:var(--bg);border:1px solid var(--line);color:var(--ink-sub)}
  .tag.dist{background:var(--done-tint);color:var(--state-done)}
  .tag.addrec{background:var(--bg);border:1px solid var(--brand-deep);color:var(--brand-deep);text-decoration:none;cursor:pointer}
  #empty{text-align:center;padding:64px 24px}
  #empty .emo{font-size:40px}
  #empty .t{font-size:17px;font-weight:800;margin:14px 0 8px;color:var(--ink)}
  #empty .m{font-size:13px;color:var(--ink-sub);line-height:1.8}
</style>
</head>
<body>
<div class="bar"><span>旅の記録</span></div>
<div id="status"><div class="spin"></div>読み込んでいます…</div>

<div id="main" class="wrap hidden">
  <div id="refresh" class="refresh hidden">最新に更新中…</div>
  <div class="hlead">これまでの一杯と、歩いた道のり。</div>
  <div class="summ">
    <div class="s"><b id="nVisit">0</b><span>訪問した回数</span></div>
    <div class="s"><b id="nShop">0</b><span>行ったお店</span></div>
    <div class="s"><b id="nPref">0</b><span>行った県</span></div>
  </div>
  <div id="list"></div>
</div>

<div id="empty" class="wrap hidden">
  <div class="emo">☕️</div>
  <div class="t">最初の一杯は、どこで飲みますか？</div>
  <div class="m">ロースターでチェックインして「今日の一杯」を残すと、<br>ここに旅の記録が並んでいきます。</div>
</div>

<!-- 写真の拡大（タップで開く／背景か×で閉じる） -->
<div class="lightbox" id="lightbox"><button class="lx" id="lxClose" aria-label="閉じる">×</button><img id="lxImg" alt=""></div>

<script>
  const LIFF_ID = "2008851980-6s0zFwwl"; // 旅の記録（テスト・2026-08-31発行）
  const LOG_DRINK_LIFF_ID = "2008851980-DMVX7HZ0"; // 今日の一杯（記録を追加する遷移先）
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4ZUF9vdBoIz34-NgD927HpzQTjbD8xdK3XZ7hD1_X_5ZAHgTvmK08uB6bzB_MQByV/exec";

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let USER_ID = "";

  function render(d){
    const checkins = (d.checkins||[]);
    const drinks = (d.drinks||[]);
    // 記録も来店も無い時だけ「まだありません」。記録だけでも表示する（案A・2026-09-03）。
    if (!checkins.length && !drinks.length){ $("status").classList.add("hidden"); $("empty").classList.remove("hidden"); return; }

    // 記録は「一杯ごと」に全部見せる。来店(チェックイン)には、同じ店・同じ日の記録を1件だけ紐づけ、
    // 残りの記録は独立した行として必ず表示する（同じ店・同じ日に何度記録しても消えない）。
    const usedDrink = new Set();
    const rows = [];
    // ① 来店（チェックイン）行。まだ使っていない同店・同日の記録を1件だけくっつける。
    checkins.forEach(c => {
      let dr = null;
      for (let i=0;i<drinks.length;i++){
        const x = drinks[i];
        if (usedDrink.has(x)) continue;
        if (x.shopId===c.shopId && x.date===c.date){ dr=x; usedDrink.add(x); break; }
      }
      rows.push({ ms:c.ms, date:c.date, shopId:c.shopId, shopName:c.shopName, pref:c.pref, km:c.km, dr:dr, visit:true });
    });
    // ② 来店にくっつかなかった記録は、すべて独立した行に（1杯＝1行・消さない）。
    drinks.forEach(x => {
      if (usedDrink.has(x)) return;
      rows.push({ ms:x.ms, date:x.date, shopId:x.shopId, shopName:x.shopName, pref:x.pref, km:null, dr:x, visit:false });
    });
    // 日付順（新しい順）に自然に混ぜる
    rows.sort((a,b)=> (b.ms||0)-(a.ms||0));

    // まとめ（訪問数・店数・県数＝来店ベース。従来どおり）
    const shops = {}, prefs = {};
    checkins.forEach(c => { if(c.shopId) shops[c.shopId]=1; if(c.pref) prefs[c.pref]=1; });
    $("nVisit").textContent = checkins.length;
    $("nShop").textContent = Object.keys(shops).length;
    $("nPref").textContent = Object.keys(prefs).length;

    $("list").innerHTML = rows.map(r=>{
      const dr=r.dr;
      const recorded = !!dr;
      const logo = r.shopId
        ? '<img class="hlogo" src="https://japancoffeejourney.com/jcj_passport_img/shop/'+encodeURIComponent(r.shopId)+'/logo.png" onerror="this.style.display=\'none\'">'
        : '';
      let tags="";
      if (dr){
        if (dr.drink)   tags += '<span class="tag drink">'+esc(dr.drink)+'</span>';
        if (dr.country) tags += '<span class="tag ctry">'+esc(dr.country)+'</span>';
      } else {
        // 記録が無い来店＝「記録を追加する」で今日の一杯へ（その店を引き継ぐ）
        const u = "https://liff.line.me/"+LOG_DRINK_LIFF_ID+"?shop="+encodeURIComponent(r.shopId||"")+"&name="+encodeURIComponent(r.shopName||"")+"&date="+encodeURIComponent(r.ms||"");
        tags += '<a class="tag addrec" href="'+u+'">＋ 記録を追加する</a>';
      }
      if (r.km!=null) tags += '<span class="tag dist">約'+r.km+'km</span>';
      // B案：記録に写真があれば、下に大きく（タップで拡大＝行タップの店詳細とは別動作）
      // 表示URLはLINE内ブラウザで映りやすいDriveサムネイル形式へ変換。
      // 読み込めない時は黙って消さず「写真を表示できません」と見せる（保存済みか否かの切り分け用）。
      const rawPhoto = (dr && dr.photo) ? String(dr.photo) : "";
      // コメント（メモ）は写真の上に出す
      const memoHtml = (dr && dr.memo) ? '<div class="hmemo">'+esc(dr.memo)+'</div>' : '';
      const photoHtml = rawPhoto
        ? '<img class="hphoto" src="'+esc(toThumbUrl(rawPhoto))+'" loading="lazy" alt="" data-full="'+esc(rawPhoto)+'" '+
          'onerror="this.onerror=null;var b=document.createElement(\'div\');b.className=\'hphoto phbad\';b.textContent=\'写真を表示できません\';this.replaceWith(b);">'
        : '';
      return '<div class="hrow'+(recorded?' recorded':'')+'" data-shop="'+esc(r.shopId||"")+'">'+
        '<div class="htop"><div class="hdate"><span class="d">'+esc(r.date)+'</span>'+logo+'</div>'+
        '<div class="hbody"><div class="hname">'+esc(r.shopName||"お店")+'</div>'+
        '<div class="hpl">'+esc(r.pref||"")+'</div>'+
        '<div class="htags">'+tags+'</div></div></div>'+
        memoHtml+
        photoHtml+
      '</div>';
    }).join("");

    // 行をタップ→お店の詳細（「記録を追加する」ボタンを押した時はそちら優先）
    $("list").querySelectorAll(".hrow").forEach(function(row){
      row.style.cursor="pointer";
      row.onclick=function(e){
        if(e.target.closest(".addrec")) return; // 記録を追加するは自分のリンクへ
        const ph = e.target.closest(".hphoto");
        if(ph){ openLightbox(ph.getAttribute("src")); return; } // 写真タップ＝拡大（店詳細に行かない）
        var id=row.getAttribute("data-shop");
        if(id) location.href="shop.html?shop="+encodeURIComponent(id)+"&t="+Date.now();
      };
    });

    $("status").classList.add("hidden");
    $("main").classList.remove("hidden");
  }

  // 保存URL(lh3形式など)を、LINE内ブラウザで映りやすいDriveサムネイルURLへ変換
  function toThumbUrl(u){
    if(!u) return u;
    var m = u.match(/lh3\.googleusercontent\.com\/d\/([^=?/]+)/) || u.match(/[?&]id=([^&]+)/) || u.match(/\/d\/([^/?]+)/);
    if(m && m[1]) return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1200";
    return u; // Driveでない（Xサーバー等）URLはそのまま
  }
  // 写真の拡大（ライトボックス）。背景タップか×で閉じる。
  function openLightbox(src){ if(!src) return; $("lxImg").src = src; $("lightbox").classList.add("show"); }
  function closeLightbox(){ $("lightbox").classList.remove("show"); $("lxImg").src=""; }
  $("lxClose").onclick = closeLightbox;
  $("lightbox").onclick = function(e){ if(e.target === this) closeLightbox(); };

  async function load(){
    // 前回分を先に出す＝体感ゼロ待ち（2回目以降）。無ければスピナーのまま裏で取得。
    let cached=null;
    try{ const c=localStorage.getItem("jcj_hist_"+USER_ID); if(c) cached=JSON.parse(c); }catch(e){}
    if(cached && cached.checkins){ render(cached); $("refresh").classList.remove("hidden"); }
    try{
      const res = await fetch(GAS_URL+"?action=my_history&userId="+encodeURIComponent(USER_ID)+"&_="+Date.now());
      const d = await res.json();
      if(!d||!d.ok){ if(!cached) $("status").textContent="読み込みに失敗しました。時間をおいて開き直してください。"; $("refresh").classList.add("hidden"); return; }
      render(d);
      try{ localStorage.setItem("jcj_hist_"+USER_ID, JSON.stringify(d)); }catch(e){}
      $("refresh").classList.add("hidden");
    }catch(e){ if(!cached) $("status").textContent="通信エラーが起きました。電波の良い場所でお試しください。"; $("refresh").classList.add("hidden"); }
  }

  async function main(){
    const previewUid = String(params.get("uid")||"").trim();
    const liffReady = /^\d+-/.test(LIFF_ID) && LIFF_ID.indexOf("XXXXXXXX")<0;
    if(!liffReady){ USER_ID = previewUid; return load(); }
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    const profile = await liff.getProfile();
    USER_ID = profile.userId || previewUid;
    if(!USER_ID){ $("status").textContent="ユーザー情報を取得できませんでした。"; return; }
    try{ if(USER_ID) localStorage.setItem("jcj_uid", USER_ID); }catch(e){} // shop.htmlの保存で使う（同一オリジン・URLに載せない）
    load();
  }
  main().catch(err => $("status").textContent = "エラー: "+(err&&err.message||String(err)));
</script>
</body>
</html>
