<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>お店を見る</title>
<style>
  /* JCJ 新トンマナ8色 */
  *{box-sizing:border-box}
  :root{--brand-base:#CB7B68;--brand-deep:#C04A55;--state-done:#2F7A57;--state-error:#C0392B;
    --paper:#F4EADD;--bg:#FFFFFF;--ink:#221C1A;--ink-sub:#6E655E;--line:#DDD6CE;--done-tint:#E7F0EB;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
  .bar{background:var(--brand-base);color:#fff;padding:13px 16px;font-size:18px;font-weight:800;position:sticky;top:0;z-index:5}
  #status{text-align:center;padding:90px 20px;color:var(--ink-sub);font-size:14px}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand-deep);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .wrap{max-width:520px;margin:0 auto;padding:0 0 40px}
  .hidden{display:none!important}
  .swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:0}
  .swipe::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:start}
  .slide .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--paper)}
  .slide .cap{font-size:12px;color:var(--ink-sub);line-height:1.7;padding:9px 16px 2px}
  .slide .cap b{color:var(--brand-deep);font-weight:800;margin-right:6px}
  .dots{display:flex;gap:6px;justify-content:center;margin:8px 0 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--brand-deep)}
  .body{padding:14px 16px 0}
  .copy{font-size:14px;font-weight:800;color:var(--ink);line-height:1.55;margin:2px 0 4px}
  .name{font-size:20px;font-weight:900;margin:6px 0 2px}
  .place{font-size:12.5px;color:var(--ink-sub);margin-bottom:14px}
  .btnP{display:block;width:100%;background:var(--brand-deep);color:#fff;text-align:center;font-weight:800;font-size:15.5px;
    border-radius:12px;padding:14px;text-decoration:none;box-shadow:0 4px 10px rgba(192,74,85,.25);margin-bottom:10px;border:0;cursor:pointer}
  .btnP.saved{background:var(--done-tint);color:var(--state-done);box-shadow:none}
  .gciBtn{display:block;width:100%;margin:14px 0 0;padding:15px;border:0;border-radius:12px;
          background:var(--brand-deep,#1F3A2E);color:#fff;font-weight:800;font-size:15px;text-align:center}
  .gciBtn:disabled{opacity:.55}
  .gciNote{font-size:10.5px;color:#8A8A8A;text-align:center;margin-top:6px}
  .gciBox:empty{display:none}
  .gciBox{margin-top:10px;background:#fff;border:1px solid #E2DAD2;border-radius:12px;padding:13px}
  .gciT{text-align:center;font-size:14.5px;font-weight:800;line-height:1.5}
  .gciM{font-size:12px;color:#6B6B6B;line-height:1.8;margin-top:9px}
  .gciPlate{width:150px;margin:12px auto 0;background:#fff;border:1px solid #D8CFC4;border-radius:7px;padding:12px 10px;text-align:center}
  .gciPlate .br{font-size:9.5px;color:var(--brand-deep,#1F3A2E);font-weight:800;letter-spacing:.06em}
  .gciPlate .lg{width:56px;height:56px;border-radius:50%;background:var(--brand-deep,#1F3A2E);margin:9px auto 0;
                display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-size:15px;font-weight:800}
  .gciPlate .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
  .gciPlate .cp{font-size:11px;color:var(--brand-deep,#1F3A2E);font-weight:800;margin-top:9px}
  .gciPlate .qr{width:40px;height:40px;margin:8px auto 0;background:repeating-conic-gradient(var(--brand-deep,#1F3A2E) 0% 25%,#fff 0% 50%) 50%/8px 8px;border:2px solid #fff;outline:1px solid #D8CFC4}
  .gciWhere{font-size:10.5px;color:#8A8A8A;text-align:center;margin-top:9px;line-height:1.6}
  .refer{display:none;background:var(--paper);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink);text-align:center;margin:-2px 0 12px}
  .refer.on{display:block}
  .refer b{color:var(--brand-deep)}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .links a{flex:1 1 30%;min-width:96px;text-align:center;background:var(--bg);border:1.5px solid var(--brand-deep);
    color:var(--brand-deep);font-weight:800;font-size:13.5px;border-radius:12px;padding:11px 8px;text-decoration:none}
  .btnO{display:block;text-align:center;background:var(--bg);color:var(--brand-deep);border:1.5px solid var(--brand-deep);
    font-weight:800;font-size:14.5px;border-radius:12px;padding:12px;text-decoration:none;margin-bottom:8px;cursor:pointer}
  .sublink{display:block;text-align:center;color:var(--ink-sub);font-size:13.5px;font-weight:600;text-decoration:underline;padding:6px;cursor:pointer}
</style>
</head>
<body>
<div class="bar">お店を見る</div>
<div id="status"><div class="spin"></div>読み込んでいます…</div>
<div id="main" class="wrap hidden">
  <div class="swipe" id="swipe"></div>
  <div class="dots" id="dots"></div>
  <div class="body">
    <div class="copy" id="copy"></div>
    <div class="name" id="name"></div>
    <div class="place" id="place"></div>
    <button class="gciBtn" id="gciBtn" style="display:none">このお店でチェックインする</button>
    <div class="gciNote" id="gciNote" style="display:none">お店に着いてから押してください</div>
    <div class="gciBox" id="gciBox"></div>
    <button class="btnP" id="saveBtn">行きたいに保存する</button>
    <div class="refer" id="referBox">保存しました。<b>友だちに教える</b>と、あなたにもマイルがたまります。</div>
    <div class="links" id="links"></div>
    <a class="btnO" id="shareBtn" href="#">友だちに教える</a>
    <a class="sublink" id="mapBtn" target="_blank" rel="noopener">行き方を見る（Googleマップ）</a>
  </div>
</div>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4ZUF9vdBoIz34-NgD927HpzQTjbD8xdK3XZ7hD1_X_5ZAHgTvmK08uB6bzB_MQByV/exec";
  const SHARE_LIFF_ID = "2008851980-V8WaCaZw"; // 友だちに教える（テスト）
  // ロゴ帳/旅の記録が同一オリジンのlocalStorageに置いたuserId（URLに載せない）。無ければ保存は非表示。
  const UID = (function(){ try{ return localStorage.getItem("jcj_uid")||""; }catch(e){ return ""; } })();
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const SHOP_ID = String(new URLSearchParams(location.search).get("shop")||"").trim();

  // 店内写真の最大枚数（interior.jpg / interior2.jpg / interior3.jpg）。写真を置いた店だけ増える。
  const SW_INTERIOR_MAX = 3;
  let SW_TOKEN = 0;

  // ドットを今の枚数で作り直す（1枚だけならドットは出さない）
  function swDots(){
    const track=$("swipe"), dots=$("dots"), n=track.children.length;
    dots.innerHTML = n>1 ? [...track.children].map((_,i)=>'<i class="'+(i===0?"on":"")+'"></i>').join("") : "";
    swSyncDots();
  }
  // 今どの写真を見ているかにドットを合わせる
  function swSyncDots(){
    const track=$("swipe"), dots=$("dots"), n=dots.children.length;
    if(!n) return;
    let i = Math.round(track.scrollLeft / (track.clientWidth||1));
    if(i<0) i=0; if(i>n-1) i=n-1;
    [...dots.children].forEach((d,j)=>d.classList.toggle("on",j===i));
  }
  // 読み込めなかった写真は、そのページごと消す（＝空白のページも余分なドットも出さない）
  function swFail(el){
    const track=$("swipe");
    if(el && el.parentNode===track) track.removeChild(el);
    swDots();
  }
  function swBindOne(el){
    const im=el.querySelector("img"); if(!im) return;
    im.onerror=()=>swFail(el);
  }
  // 待たせていた2枚目以降を実際に読み込む
  function swLoadRest(){
    $("swipe").querySelectorAll("img[data-src]").forEach(im=>{
      const u=im.getAttribute("data-src"); im.removeAttribute("data-src"); im.src=u;
    });
  }
  // ※文章（AC列 店内紹介）は1店に1つ＝2枚目以降には付けない（本部_v39 2026-09-04 決定「文章は1枚目だけ」）。
  // 将来2・3枚目にも文章を出したくなったら、AC列の中を「｜」で区切って振り分ける手が使える（列追加もGAS変更も不要）。今は実装しない。
  // 店内の2枚目・3枚目（interior2.jpg / interior3.jpg）を探して、あった分だけ店内の後ろに足す。
  // 無い店では404が返るだけでページを作らない＝空白のページも余分なドットも出ない。
  function swExtras(s,tok){
    const base = String(s.interiorPhoto||"");
    if(!/interior\.jpg(\?|$)/i.test(base)) return;
    const urls=[]; for(let n=2;n<=SW_INTERIOR_MAX;n++) urls.push(base.replace(/interior\.jpg/i,"interior"+n+".jpg"));
    const got=[]; let left=urls.length;
    urls.forEach((u,i)=>{
      const probe=new Image();
      probe.onload =()=>{ got[i]=u; settle(); };
      probe.onerror=()=>settle();   // 無ければ何もしない
      probe.src=u;
    });
    function settle(){
      if(--left>0) return;
      if(SW_TOKEN!==tok) return;    // 別の店に切り替わっていたら捨てる
      const track=$("swipe");
      let prev=null;
      [...track.children].forEach(el=>{ if(el.dataset.k==="int") prev=el; });
      if(!prev) return;   // 店内のページが無い（写真が読めず消えた）なら足さない
      let added=0;
      urls.forEach((_,j)=>{
        if(!got[j]) return;
        const d=document.createElement("div"); d.className="slide"; d.dataset.k="int";
        d.innerHTML='<img class="ph" alt="" decoding="async" src="'+esc(got[j])+'">';
        track.insertBefore(d,prev.nextSibling);
        swBindOne(d); prev=d; added++;
      });
      if(added) swDots();
    }
  }
  // 写真スワイプ（外観→店内(最大3枚)→お店の人。あるものだけ）
  // 1枚目だけ即読み、2枚目以降は「1枚目が出たら／指が触れたら」読み込む＝開いた瞬間を軽くする
  function buildSwipe(s){
    const track=$("swipe"), dots=$("dots");
    const slides = [
      {k:"ext", u:s.photo,         t:s.exteriorText, label:"外観"},
      {k:"int", u:s.interiorPhoto, t:s.interiorText, label:"店内"},
      {k:"ro",  u:s.roasterPhoto,  t:s.roasterVoice, label:"お店の人"}
    ].filter(x=>x.u);
    if(!slides.length){ track.innerHTML=""; dots.innerHTML=""; return; }
    const tok = ++SW_TOKEN;
    track.innerHTML = slides.map((x,i) =>
      '<div class="slide" data-k="'+x.k+'"><img class="ph" alt="" decoding="async" '+(i===0?('src="'+esc(x.u)+'" fetchpriority="high"'):('data-src="'+esc(x.u)+'"'))+'>'+
      (x.t ? '<div class="cap"><b>'+x.label+'</b>'+esc(x.t)+'</div>' : '')+'</div>'
    ).join("");
    [...track.children].forEach(swBindOne);
    swDots();
    track.scrollLeft=0;

    let started=false;
    const go=()=>{ if(started||SW_TOKEN!==tok) return; started=true; swLoadRest(); swExtras(s,tok); };
    track.onscroll=()=>{ go(); swSyncDots(); };
    track.ontouchstart=go;
    track.onmousedown=go;
    const first=track.querySelector("img");
    if(first && !first.complete){ first.addEventListener("load",go); first.addEventListener("error",go); }
    else { setTimeout(go,0); }
    setTimeout(go,2500);   // 保険（写真が返ってこない回線でも必ず動く）
  }

  function render(s){
    buildSwipe(s);

    $("copy").textContent = s.copy || "";
    $("copy").style.display = s.copy ? "" : "none";
    $("name").textContent = s.name || "お店";
    $("place").textContent = s.place || s.pref || "";
    if (s.mapUrl){ $("mapBtn").href = s.mapUrl; } else { $("mapBtn").style.display="none"; }

    let links="";
    if (s.web)  links += '<a href="'+esc(s.web)+'" target="_blank" rel="noopener">公式サイト</a>';
    if (s.ig)   links += '<a href="'+esc(s.ig)+'" target="_blank" rel="noopener">Instagram</a>';
    if (s.line) links += '<a href="'+esc(s.line)+'" target="_blank" rel="noopener">LINE</a>';
    $("links").innerHTML = links;

    // 行きたいに保存（主役）＝ロゴ帳/旅の記録から来た時はuserIdあり。直接開き（userId無し）は保存を隠す。
    if (UID){
      $("saveBtn").onclick = function(){
        try{ fetch(GAS_URL+"?action=discover_save&spotId="+encodeURIComponent(s.id)+"&userId="+encodeURIComponent(UID)+"&source=shop&_="+Date.now()); }catch(e){}
        $("saveBtn").className="btnP saved"; $("saveBtn").textContent="保存しました"; $("referBox").className="refer on";
      };
    } else {
      $("saveBtn").style.display="none";
    }
    // 📍 GPSチェックイン＝入口は新設せず、いま見ているこの画面に置く。GPSは「そこにいるか」の証明だけ。
    //    ★関門0：位置は「その場で取り直す・高精度」。maximumAge:60000 は41秒後に前回と同じ座標を返す
    //      ことを実測済み（2026-09-12）＝古い位置の使い回し。緩めると半径を何mにしても判定が成立しない。
    // 📈 このお店のページを開いたことを記録（投げっぱなし＝表示は止めない・店IDつき）
    try{ if(UID && /^U[0-9a-f]{32}$/i.test(UID) && s.id)
      fetch(GAS_URL+"?action=page_view&page=shop&spot="+encodeURIComponent(s.id)
            +"&userId="+encodeURIComponent(UID)+"&_="+Date.now(),{method:"GET",mode:"no-cors",keepalive:true}); }catch(e){}

    gciSetup(s);

    // 友だちに教える（紹介LIFFへ）
    $("shareBtn").onclick = function(e){ e.preventDefault(); location.href="https://liff.line.me/"+SHARE_LIFF_ID+"?shopId="+encodeURIComponent(s.id)+"&source=shop"; };

    $("status").classList.add("hidden");
    $("main").classList.remove("hidden");
  }

  async function main(){
    if(!SHOP_ID){ $("status").textContent="お店が指定されていません。"; return; }
    try{
      const res = await fetch(GAS_URL+"?action=discover_shops&_="+Date.now());
      const d = await res.json();
      const s = (d.shops||[]).find(x=>x.id===SHOP_ID);
      if(!s){ $("status").textContent="お店が見つかりませんでした。"; return; }
      document.title = (s.name||"お店")+" ｜ お店を見る";
      render(s);
    }catch(e){ $("status").textContent="通信エラーが起きました。電波の良い場所でお試しください。"; }
  }
  main();

  function gciGeo(){
    return new Promise(function(res){
      if(!navigator.geolocation){ res({geo:"unsupported"}); return; }
      navigator.geolocation.getCurrentPosition(
        function(p){ res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}); },
        function(e){ res({geo:(e&&e.code===1)?"denied":((e&&e.code===3)?"timeout":"unavailable")}); },
        { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
      );
    });
  }
  // 断り画面のプレートの絵。ロゴはその店のものを規則URLから。読めなければ頭文字＝壊れた枠は出さない。
  function gciPlate(s){
    var ini=(s.name||"?").trim().charAt(0);
    return '<div class="gciPlate"><div class="br">JAPAN COFFEE JOURNEY</div>'
      + '<div class="lg"><img src="https://japancoffeejourney.com/jcj_passport_img/shop/'
      + encodeURIComponent(s.id) + '/logo.png" alt="" '
      + 'onerror="this.parentNode.textContent=' + JSON.stringify(ini) + '"></div>'
      + '<div class="cp">来店を記録する</div><div class="qr"></div></div>'
      + '<div class="gciWhere">レジ横や展示物があるエリアなどに置かれています。</div>';
  }
  function gciNg(s,title,msg){
    $("gciBox").innerHTML='<div class="gciT">'+title+'</div><div class="gciM">'+msg+'</div>'+gciPlate(s);
  }
  function gciSetup(s){
    var b=$("gciBtn"), n=$("gciNote"); $("gciBox").innerHTML="";
    var isEvent = /EV|_FS_/i.test(s.id||"") || (s.name||"").indexOf("イベント")>=0;
    if(!UID || !s.id || isEvent){ b.style.display="none"; n.style.display="none"; return; }
    b.style.display=""; n.style.display=""; b.disabled=false; b.textContent="このお店でチェックインする";
    b.onclick=function(){ gciGo(s); };
  }
  async function gciGo(s){
    var b=$("gciBtn"); if(b.disabled) return;
    b.disabled=true; b.textContent="いまの場所を確認しています…"; $("gciBox").innerHTML="";
    var g=await gciGeo();
    b.textContent="記録しています…";
    try{
      var q=new URLSearchParams({action:"checkin_gps_do",userId:UID,spot:s.id,_:Date.now()});
      if(g.lat!==undefined){ q.set("lat",g.lat); q.set("lng",g.lng); q.set("acc",g.acc); }
      else { q.set("geo",g.geo||"unavailable"); }
      var r=await (await fetch(GAS_URL+"?"+q.toString())).json();
      b.disabled=false; b.textContent="このお店でチェックインする";
      if(r&&r.ok){
        $("gciBox").innerHTML='<div class="gciT">お店に着いたことを、確認しました</div>'
          + '<div class="gciM" style="text-align:center">'
          + (r.alreadyToday ? "今日はすでに記録ずみです。" : "旅マイル <b>+"+(r.earnedMile||0)+"</b>　合計 "+(r.newTotal||0)+" マイル")
          + '</div>';
        b.style.display="none"; $("gciNote").style.display="none";
        return;
      }
      var e=(r&&r.error)||"failed";
      if(e==="no_geo")             gciNg(s,"いまの場所が確認できませんでした","お店に置いてある<b>このチェックインプレート</b>にスマホをかざすと、そのままチェックインできます。マイルはそのまま受け取れます。");
      else if(e==="acc_too_large") gciNg(s,"場所をうまく読み取れませんでした","お店の中は電波が弱いことがあります。<b>このチェックインプレート</b>にスマホをかざしてください。マイルはそのまま受け取れます。");
      else if(e==="too_far")       gciNg(s,"このお店の近くにいることが確認できませんでした","お店に着いてから、もう一度どうぞ。<b>このチェックインプレート</b>にスマホをかざしてもチェックインできます。");
      else if(e==="not_registered")gciNg(s,"はじめに登録が必要です","JCJパスポートに登録すると、この記録が残せます。");
      else if(e==="off")           { b.style.display="none"; $("gciNote").style.display="none"; }
      else                         gciNg(s,"うまくいきませんでした","少し時間をおいて、もう一度お試しください。<b>このチェックインプレート</b>にスマホをかざしてもチェックインできます。");
    }catch(err){
      b.disabled=false; b.textContent="このお店でチェックインする";
      gciNg(s,"通信できませんでした","電波の良い場所で、もう一度お試しください。");
    }
  }
</script>
</body>
</html>
