<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />

<title>お住まいの市区町村</title>
<style>
  :root{
    --cream:#faf5ee; --paper:#ffffff; --ink:#3a2f25; --sub:#8a7a68;
    --teal:#1f6b57; --teal-d:#17513f; --brown:#9f866a; --brown-d:#6f5b44;
    --coral:#DF7461; --coralBtn:#C9573F; --line:#ece3d6; --field:#fbf7f1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  .wrap{max-width:440px;margin:0 auto;padding:0 18px 24px}

  .status{color:var(--sub);font-size:14px;padding:56px 0;text-align:center}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none}

  .head{padding:22px 4px 6px;text-align:center}
  .head .kicker{font-size:11px;color:var(--brown);letter-spacing:.12em;font-weight:700}
  .head .h1{font-size:20px;font-weight:800;margin-top:6px;line-height:1.4}
  .head .lead{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.7;font-weight:600}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;margin-top:16px;box-shadow:0 4px 16px rgba(120,95,60,.07)}
  label{display:block;font-size:12.5px;color:var(--brown-d);font-weight:800;margin:14px 2px 7px}
  label:first-child{margin-top:2px}
  select{width:100%;padding:13px 12px;border-radius:12px;border:1.5px solid var(--line);
    font-size:16px;background:var(--field);color:var(--ink);appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239f866a' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center}
  select:disabled{opacity:.5}
  select:focus{outline:none;border-color:var(--teal)}

  .note{font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.6;font-weight:600}

  .btn{display:block;width:100%;height:52px;line-height:52px;text-align:center;border-radius:13px;border:none;
    font-size:16px;font-weight:800;text-decoration:none;cursor:pointer;margin-top:16px}
  .btn.primary{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(201,87,63,.28)}
  .btn.primary:active{background:var(--coralBtn)}
  .btn.primary:disabled{background:#e7d9cd;color:#fff;box-shadow:none;cursor:default}
  .btn.ghost{background:transparent;color:var(--brown-d);border:none;height:44px;line-height:44px;font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px}

  .done{text-align:center;padding:36px 0}
  .done .ic{font-size:40px;line-height:1}
  .done .t{font-size:19px;font-weight:800;margin-top:12px}
  .done .s{font-size:13.5px;color:var(--sub);margin-top:8px;line-height:1.7;font-weight:600}

  .msg{font-size:12.5px;font-weight:700;margin-top:12px;text-align:center;min-height:18px}
  .msg.err{color:var(--coralBtn)}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="wrap">

  <div id="status" class="status">
    <div class="spin"></div>
    <div id="statusText">起動中…</div>
  </div>

  <!-- 入力フォーム -->
  <div id="main" class="hidden">
    <div class="head">
      <div class="kicker">JAPAN COFFEE JOURNEY</div>
      <div class="h1">お住まいの市区町村</div>
      <div class="lead">お住まいの市区町村を選ぶと、遠くから行った分もちゃんとマイルになります。<br>今は大まかな位置で計算中。<br>番地は取りません／あとで変えられます。</div>
    </div>

    <div class="card">
      <label for="pref">都道府県</label>
      <select id="pref"><option value="">選択してください</option></select>

      <label for="city">市区町村</label>
      <select id="city" disabled><option value="">先に都道府県を選ぶ</option></select>

      <div class="note">※ ここで選んだ市区町村を起点に距離を測ります。選ばない場合は、これまで通り都道府県の中心を起点にします（不利にはなりません）。</div>

      <div id="msg" class="msg"></div>

      <button id="submitBtn" class="btn primary" disabled>この市区町村で設定する</button>
      <button id="skipBtn" class="btn ghost">あとで（このまま閉じる）</button>
    </div>
  </div>

  <!-- 完了画面 -->
  <div id="doneView" class="hidden">
    <div class="done">
      <div class="ic">📍</div>
      <div class="t" id="doneTitle">設定しました</div>
      <div class="s" id="doneSub"></div>
    </div>
  </div>

</div>

  let USER_ID = "";

  function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
  function $(id){ return document.getElementById(id); }

  function fillPrefs(){
    const sel = $("pref");
    Object.keys(CITY_DATA).forEach(function(p){
      const o = document.createElement("option");
      o.value = p; o.textContent = p; sel.appendChild(o);
    });
  }

  function fillCities(pref){
    const sel = $("city");
    sel.innerHTML = "";
    const list = CITY_DATA[pref] || [];
    if(!list.length){
      sel.innerHTML = '<option value="">先に都道府県を選ぶ</option>';
      sel.disabled = true; return;
    }
    const head = document.createElement("option");
    head.value = ""; head.textContent = "選択してください";
    sel.appendChild(head);
    list.forEach(function(x){
      const o = document.createElement("option");
      o.value = x.n; o.textContent = x.n;
      o.dataset.c = x.c || "";
      sel.appendChild(o);
    });
    sel.disabled = false;
  }

  function refreshBtn(){
    const pref = $("pref").value.trim();
    const city = $("city").value.trim();
    $("submitBtn").disabled = !(pref && city && USER_ID);
  }

  async function submit(){
    const pref = $("pref").value.trim();
    const cityEl = $("city");
    const city = cityEl.value.trim();
    if(!pref || !city || !USER_ID) return;

    const opt = cityEl.options[cityEl.selectedIndex];
    const c = (opt && opt.dataset.c) ? opt.dataset.c : "";
    const parts = c.split(",");
    const lat = parts[0] || "";
    const lng = parts[1] || "";

    $("submitBtn").disabled = true;
    $("skipBtn").disabled = true;
    $("msg").className = "msg";
    $("msg").textContent = "設定中…";

    try{
      const q = new URLSearchParams({
        action: "set_home_city",
        userId: USER_ID,
        pref: pref,
        city: city,
        lat: lat,
        lng: lng,
        _: Date.now()
      });
      const res = await fetch(GAS_URL + "?" + q.toString(), { method: "GET" });
      const data = await res.json();

      if(data && data.ok){
        $("main").classList.add("hidden");
        $("doneSub").textContent = pref + " " + city + " を起点に、距離マイルを計算します。";
        $("doneView").classList.remove("hidden");
        setTimeout(function(){ try{ liff.closeWindow(); }catch(e){} }, 1600);
      }else{
        $("msg").className = "msg err";
        $("msg").textContent = "うまく設定できませんでした。もう一度お試しください。";
        $("submitBtn").disabled = false;
        $("skipBtn").disabled = false;
      }
    }catch(err){
      $("msg").className = "msg err";
      $("msg").textContent = "通信に失敗しました。電波の良い場所でお試しください。";
      $("submitBtn").disabled = false;
      $("skipBtn").disabled = false;
    }
  }

  async function main(){
    fillPrefs();

    // 事前選択（登録直後に ?pref=東京都 を渡すと都道府県が選ばれた状態で開く）
    const pre = qs("pref");
    if(pre && CITY_DATA[pre]){ $("pref").value = pre; fillCities(pre); }

    $("pref").addEventListener("change", function(){ fillCities(this.value); refreshBtn(); });
    $("city").addEventListener("change", refreshBtn);
    $("submitBtn").addEventListener("click", submit);
    $("skipBtn").addEventListener("click", function(){ try{ liff.closeWindow(); }catch(e){} });

    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    const profile = await liff.getProfile();
    USER_ID = profile.userId || "";

    $("status").classList.add("hidden");
    $("main").classList.remove("hidden");
    refreshBtn();
  }

  main().catch(function(err){
    $("statusText").textContent = "エラー: " + (err && err.message ? err.message : String(err));
  });
</script>
</body>
</html>
