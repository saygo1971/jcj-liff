<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>JCJ チェックイン</title>
  <style>
    :root{ --brand:#0F6E56; --coral:#C04A55; --green:#2F7A57; --ink:#221C1A; --paper:#F4EADD; --brand2:#DCE7D8; --amber:#BA7517; --line:#DDD6CE; --muted:#6E655E; --hint:#999; }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;margin:0;background:#f4f4f2;color:#222}
    .wrap{max-width:480px;margin:0 auto;padding:14px}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .hero{width:100%;height:170px;object-fit:cover;display:block;background:#C9D6DC}
    .body{padding:16px}
    .brand{font-size:12px;color:var(--muted);font-weight:700}
    .shop{font-size:19px;font-weight:800;margin:3px 0}
    .pref{font-size:13px;color:var(--muted)}
    .go{width:100%;margin-top:16px;height:52px;border-radius:12px;border:none;font-size:16px;font-weight:700;color:#fff;background:var(--coral)}
    .go:disabled{opacity:.5}
    .fine{font-size:11px;color:var(--hint);margin-top:8px;text-align:center}
    .ask{margin-top:14px;background:#eef6f2;border:1px solid #cfe4da;border-radius:12px;padding:12px 13px;font-size:13.5px;line-height:1.75;color:#215}
    .ask b{color:var(--brand)}
    .asknote{color:#777;font-size:12px}
    .holdmsg{margin:14px 12px 4px;background:#fff7ea;border:1px solid #f0d9a8;border-radius:12px;padding:12px 13px;font-size:13px;line-height:1.75;color:#6b4c12}
    .holdmsg b{color:var(--amber)}
    .done{padding:18px;text-align:center;color:#fff}
    .done.ci{background:var(--green)}
    .done.today{background:var(--amber)}
    .done.hold{background:var(--amber)}
    .done .ic{font-size:30px;line-height:1}
    .done .t{font-size:16px;font-weight:800;margin-top:4px}
    .donecard{width:100%;height:auto;display:block;background:#C9D6DC}
    .refcard{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
    .refbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
    .reftitle{font-size:14px;font-weight:800;color:var(--ink);text-align:center}
    .refdesc{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.7}
    .refbtn{width:100%;margin-top:12px;height:48px;border-radius:12px;border:1px solid var(--coral);font-size:15px;font-weight:700;color:var(--coral);background:#fff}
    .mile{font-size:24px;font-weight:800;color:var(--ink);text-align:center;margin:8px 0}
    .total{font-size:13px;color:var(--muted);text-align:center}
    .bsec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
    .btrack{height:12px;background:var(--paper);border-radius:6px;overflow:hidden}
    .bfill{height:100%;background:#CB7B68;border-radius:6px}
    .bnote{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
    .bnote b{font-weight:800;color:var(--ink)}
    .bready{font-size:14px;font-weight:800;color:var(--coral);margin-top:10px;text-align:center}
    .bnext{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
    .bbtn{display:block;text-align:center;text-decoration:none;margin-top:10px;height:48px;line-height:48px;border-radius:12px;color:#fff;background:var(--coral);font-weight:700;font-size:15px}
    .tsec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
    .thd{font-size:14px;color:#444;font-weight:700;display:flex;align-items:center;gap:6px}
    .stepper{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
    .stepper button{width:46px;height:46px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:22px}
    .stepper button:disabled{opacity:.35}
    .cnt{text-align:center}
    .cnt .n{font-size:26px;font-weight:800}
    .use{width:100%;margin-top:14px;height:50px;border-radius:12px;border:none;font-size:16px;font-weight:700;color:#fff;background:var(--amber)}
    .use:disabled{opacity:.5}
    .link{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--muted);text-decoration:underline}
    .msg{margin-top:12px;font-size:13px;border-radius:10px;padding:10px 12px}
    .msg.ok{background:#e8f5ea;color:#1b5e20}
    .msg.ng{background:#fdecea;color:#b71c1c}
    .status{color:var(--muted);font-size:13px;padding:34px 0;text-align:center}
    .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* 完了カードの頭：ロゴ左＋右に店名・マイル縦積み */
    .cihead{display:flex;align-items:center;gap:12px;margin-top:4px}
    .cilogo{width:60px;height:60px;border-radius:50%;flex-shrink:0;object-fit:cover;background:var(--paper);border:1px solid var(--line)}
    .cilogo.fallback{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;font-weight:800}
    .cimeta{min-width:0}
    .cishop{font-size:17px;font-weight:800;line-height:1.25}
    .cimile{margin-top:2px}
    .cimile .pl{font-size:14px;color:var(--muted)}
    .cimile .n{font-size:24px;font-weight:800;color:var(--ink)}
    .cimile .u{font-size:13px;color:var(--muted)}
    .citotal{font-size:12px;color:var(--muted);margin-left:6px}
    .areaprog{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;text-align:center;font-size:13px;color:var(--ink)}
    .areaprog b{color:var(--ink);font-weight:800}
    .hidden{display:none}
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="status" class="status">
      <div id="spin" class="spin"></div>
      <div id="statusText">起動中…</div>
    </div>

    <img id="hero" class="hero hidden" alt="" />
    <div id="body" class="body hidden"></div>
  </div>
</div>

<script>
  // ===== 設定（テスト環境）=====
  // LIFF_ID：チェックイン用LIFF（テストのログインチャネル 2008851980 配下）
  const LIFF_ID = "2008851980-Ky1Q5Lh9";
  // GAS_URL：コード.js の doGet を配信しているテスト環境のデプロイURL（exchange/share と同じ）
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4ZUF9vdBoIz34-NgD927HpzQTjbD8xdK3XZ7hD1_X_5ZAHgTvmK08uB6bzB_MQByV/exec";
  // 紹介の「送る側」LIFF＝share(テスト)（"送る相手を選ぶ"）。?shopId=<チェックインした店ID> を付けて開く。友だち初来店で紹介者に+100マイル。
  // ※referralは"受け取る側"でshareId必須＝送る本人がそこへ飛ぶと「紹介情報が見つかりません」になるため share へ。
  const SHARE_URL = "https://liff.line.me/2008851980-V8WaCaZw";
  // 完了カード画像の置き場（店ごと checkin.jpg。無い店は緑帯にフォールバック）
  const CHECKIN_CARD_BASE = "https://japancoffeejourney.com/jcj_passport_img/shop/";
  // 記録（今日の一杯）への遷移用LIFF。空のあいだは枠だけ（遷移なし）。2026-09-06 テストIDを設定＝遷移が有効になった。
  const LOG_DRINK_LIFF_ID = "2008851980-DMVX7HZ0"; // 今日の一杯（テスト・エンドポイント= .../log_drink.html）。★テスト環境の値。本番IDは置かない（記録ページは書き込み画面のため）
  // 店ロゴ画像＝自社サーバー shop/<店ID>/logo.png（2026-08-31 移設完了）。店IDで導出。
  //   フォールバック順＝①logo.png → ②外観写真exterior.jpg → ③頭文字モノグラム。ロゴ無し店(404)は②③へ。
  // ============================

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const debugMode = (params.get("debug") || "") === "1";

  let USER_ID = "";
  let SPOT = "";
  let st = null;      // checkin_state の結果
  let count = 1;
  let busy = false;

  function showLoading(msg){ $("status").classList.remove("hidden"); $("spin").classList.remove("hidden"); $("statusText").textContent = msg; }
  function showStatusText(msg){ $("status").classList.remove("hidden"); $("spin").classList.add("hidden"); $("statusText").textContent = msg; }
  function hideStatus(){ $("status").classList.add("hidden"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function api(action, extra){
    const q = new URLSearchParams(Object.assign({ action:action, userId:USER_ID, _:Date.now() }, extra||{}));
    const res = await fetch(GAS_URL + "?" + q.toString(), { method:"GET" });
    return await res.json();
  }

  // ① 開いた画面：店名＋お願い文＋「現在地を確認して進む」（位置確認あり）
  function renderPrompt(){
    hideStatus();
    $("hero").src = st.shopImage || "";
    $("hero").classList.toggle("hidden", !st.shopImage);
    $("body").classList.remove("hidden");
    $("body").innerHTML =
      '<div class="brand">JCJパスポート</div>' +
      '<div class="shop">' + esc(st.shopName) + '</div>' +
      '<div class="pref">' + esc(st.pref) + '</div>' +
      '<div class="ask"><b>着いたら、チェックイン。</b><br>' +
      '<span class="asknote">「許可」を押すと、いまいる場所で記録できます。押さなくてもチェックインはできます（マイルは後で確認）。</span></div>' +
      '<button id="go" class="go">チェックインする</button>';
    $("go").onclick = doCheckin;
  }

  // 現在地を取得（取れたら {ok:true,lat,lng,acc} / 取れない・断られたら {ok:false,reason}）
  function getPosition_(){
    return new Promise(function(resolve){
      if (!navigator.geolocation){ resolve({ ok:false, reason:"unsupported" }); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){
          resolve({ ok:true, lat:pos.coords.latitude, lng:pos.coords.longitude, acc:Math.round(pos.coords.accuracy||0) });
        },
        function(err){
          // 1=許可しない / 2=取得不可 / 3=タイムアウト
          var reason = (err && err.code===1) ? "denied" : ((err && err.code===3) ? "timeout" : "unavailable");
          resolve({ ok:false, reason:reason });
        },
        { enableHighAccuracy:false, timeout:2500, maximumAge:60000 }
      );
    });
  }

  async function doCheckin(){
    if (busy) return; busy = true;
    const b = $("go"); b.disabled = true; b.textContent = "位置を確認しています…";
    // ① 現在地を取りに行く（OS標準の許可ポップアップはここで出る）
    const geo = await getPosition_();
    b.textContent = "記録しています…";
    try{
      const extra = { spot: SPOT };
      if (geo && geo.ok){ extra.lat = geo.lat; extra.lng = geo.lng; extra.acc = geo.acc; }
      else { extra.geo = (geo && geo.reason) ? geo.reason : "unavailable"; }
      const r = await api("checkin_do", extra);
      busy = false;
      if(!r || !r.ok){
        if (r && r.error === "not_registered"){ renderNeedRegister(); return; }
        b.disabled = false; b.textContent = "チェックインする";
        showMsgInline("チェックインに失敗しました。時間をおいて再度お試しください。", false); return;
      }
      renderDone(r);
    }catch(e){
      busy = false; b.disabled = false; b.textContent = "チェックインする";
      showMsgInline("通信に失敗しました。電波の良い場所でもう一度お試しください。", false);
    }
  }

  function showMsgInline(text, ok){
    let m = $("inlineMsg");
    if(!m){ m = document.createElement("div"); m.id="inlineMsg"; $("body").appendChild(m); }
    m.className = "msg " + (ok?"ok":"ng"); m.textContent = text;
  }

  // ④ 位置とれない/遠い → 保留（チェックインは記録・マイルは確認中）
  function renderHold(r){
    $("hero").classList.add("hidden");
    const card = document.querySelector(".card");
    const oldB = card.querySelector(".done, #donecard"); if(oldB) oldB.remove();
    card.insertAdjacentHTML("afterbegin",
      '<div class="done hold"><div class="ic">🕒</div><div class="t">チェックインを記録しました</div></div>');
    $("body").innerHTML =
      '<div style="height:8px"></div>' +
      '<div style="text-align:center;font-size:16px;font-weight:800">' + esc(r.shopName || st.shopName) + '</div>' +
      '<div class="holdmsg"><b>マイルは確認中です。</b><br>位置情報が確認できなかったため、マイルは保留になっています。お店の近くでもう一度チェックインすると受け取れます。</div>' +
      '<div class="fine" style="margin-top:12px">※ ずるを防ぐための仕組みです。ご協力ありがとうございます</div>';
  }

  // 🎁 豆クーポン進捗バーのHTMLを組む。値は全てサーバ(r)から。couponMile=0/未設定なら空文字（非表示）。
  //    Y(=合計マイル)に対し、あと△マイルで1枚。Y≧couponMile なら「交換できます＋交換ボタン」に切替。
  function beansProgressHtml(r){
    const couponMile = Number(r && r.couponMile) || 0;
    if (couponMile <= 0) return "";
    const y = Number(r.newTotal) || 0;
    const prog = y % couponMile;                 // 次の1枚に向けた進捗
    const remain = couponMile - prog;            // あと何マイルで次の1枚
    const canEx = Math.floor(y / couponMile) >= 1;
    const disc = Number(r.beansDiscountYen) || 0;
    const discTxt = disc > 0 ? '（¥' + disc + '割引）' : '';
    const exUrl = String((r && r.beansExchangeUrl) || '');
    // 帯グラフはやめ、既存の小さい文字リンク（.link）1行に下げる（本部_v40＋オーナー確定 2026-09-06）。
    //   ・主役は「この一杯を残す」。豆割は目立たせない
    //   ・ただし「あと◯マイル」の数字は必ず残す（進み具合が分かる情報は捨てない）
    //   ・必ず押せるようにする（リッチメニューが3ボタンになり豆割の入り口が減っているため、ここで入り口を潰さない）
    const label = canEx
      ? '豆割が1枚もらえます（あと ' + remain + ' マイルで次の1枚）'
      : 'あと ' + remain + ' マイルで 豆割' + discTxt;
    return exUrl
      ? '<a class="link" href="' + esc(exUrl) + '" id="beansLink">' + label + ' ›</a>'
      : '<div class="link" style="text-decoration:none">' + label + '</div>';
  }

  // ② 完了 →（対応店＆残あり）チケット案内
  function renderDone(r){
    // 位置は記録用に取得を試みるが「保留」で弾かない＝結果に関わらず完了画面へ進めマイル確定（本部v31 2026-08-22）。
    $("hero").classList.add("hidden");
    // 完了時の一番上：新規チェックインは店ごとの完了カード画像(checkin.jpg)。
    // 画像が無い店は onerror で従来の緑帯にフォールバック（画面が崩れない保険）。
    let banner;
    if (r.alreadyToday) {
      banner = '<div class="done today"><div class="ic">🕒</div><div class="t">本日チェックイン済み</div></div>';
    } else {
      const shopId = st.shopId || SPOT || "";
      const cardUrl = CHECKIN_CARD_BASE + encodeURIComponent(shopId) + "/checkin.jpg";
      banner = '<img id="donecard" class="donecard" alt="チェックイン完了" src="' + esc(cardUrl) + '">';
    }
    const mileHtml = r.alreadyToday
      ? '<div class="total">同じ日の重複はマイルを二重に付けません</div>'
      : '<div class="mile">＋' + (Number(r.earnedMile)||0) + 'マイル</div><div class="total">合計 ' + (Number(r.newTotal)||0) + 'マイル</div>';

    // 旅の記録への導線（素の一行・控えめ）。新型チェックインはトークに残らないため、確認先を案内する。
    const noteHtml = '<div style="font-size:13px;color:#332822;font-weight:500;text-align:center;margin-top:8px">チェックインは、旅の記録から確認できます。</div>';

    // 🎁 豆クーポン進捗バー：マイル合計に対し「あと△マイルで豆クーポン」を可視化。
    //    値は全てサーバ(apiCheckinDo)が config から読んで渡す＝ここに数値を書かない。couponMile=0 なら非表示。
    const beansProgHtml = beansProgressHtml(r);

    let ticketHtml = "";
    if (r.ticketEnabled && Number(r.ticketBalance) > 0){
      const bal = Number(r.ticketBalance);
      ticketHtml =
        '<div class="tsec">' +
          '<div class="thd">🎫 試飲チケット <span style="color:#999;font-weight:600">（残'+bal+'枚）</span></div>' +
          '<div class="stepper">' +
            '<button id="minus">−</button>' +
            '<div class="cnt"><div class="n"><span id="cnt">1</span>枚</div></div>' +
            '<button id="plus">＋</button>' +
          '</div>' +
          '<button id="use" class="use">使う</button>' +
          '<div id="tmsg"></div>' +
        '</div>';
    }

    // 紹介コーナー：チェックインした今この瞬間に友だちへお店を紹介（友だち初来店で紹介者に+100マイル）。
    const refHtml =
      '<div class="refcard"><div class="refbox">' +
        '<div class="reftitle">友だちを誘って ＋100マイル</div>' +
        '<div class="refdesc">今この場でお店をシェア。友だちが初めて来店すると、あなたに100マイル入ります。</div>' +
        '<button id="refBtn" class="refbtn">このお店を友だちに教える</button>' +
      '</div></div>';

    // 頭＝ロゴ（左）＋右に店名・マイル縦積み。ロゴ＝①自社 shop/<ID>/logo.png → ②外観写真 → ③頭文字。
    const extUrl = CHECKIN_CARD_BASE + encodeURIComponent(st.shopId || SPOT || "") + "/exterior.jpg";
    const logoUrl = CHECKIN_CARD_BASE + encodeURIComponent(st.shopId || SPOT || "") + "/logo.png";
    const initial = esc(String(r.shopName || "?").trim().slice(0,1) || "?");
    const cimile = r.alreadyToday
      ? '<div class="citotal">同じ日の重複はマイルを二重に付けません</div>'
      : '<div class="cimile"><span class="pl">＋</span><span class="n">' + (Number(r.earnedMile)||0) + '</span><span class="u"> マイル</span><span class="citotal">合計 ' + (Number(r.newTotal)||0) + '</span></div>';
    const headerHtml =
      '<div class="cihead">' +
        '<img id="cilogoImg" class="cilogo" src="' + esc(logoUrl) + '" data-ext="' + esc(extUrl) + '" alt="" onerror="if(this.dataset.ext&&this.src!==this.dataset.ext){this.src=this.dataset.ext;this.removeAttribute(\'data-ext\');}else{this.style.display=\'none\';var f=this.nextElementSibling;if(f)f.style.display=\'flex\';}">' +
        '<div class="cilogo fallback" style="display:none">' + initial + '</div>' +
        '<div class="cimeta"><div class="cishop">' + esc(r.shopName) + '</div>' + cimile + '</div>' +
      '</div>';
    // 主＝記録（今日の一杯）。LIFF未発行のあいだは遷移なし（枠のみ）。
    // 渡すのは shop（店ID）と name（店名）の2つだけ。本番「旅の記録」ページの記録リンクと同じ形。
    //   pref＝記録ページ側で受け取るだけで一度も使っていない（実コードで確認）ため渡さない。
    //   date＝「過去の来店にあとから足す」時だけの値。今回は“飲んだ直後”なので渡さない。
    const recUrl = LOG_DRINK_LIFF_ID
      ? ('https://liff.line.me/' + LOG_DRINK_LIFF_ID + '?shop=' + encodeURIComponent(st.shopId || SPOT || "") + '&name=' + encodeURIComponent(r.shopName || ""))
      : "";
    const recordHtml =
      '<div style="text-align:center;font-size:15px;font-weight:700;color:var(--ink);margin-top:16px">今日の一杯は？</div>' +
      '<div class="fine" style="text-align:center;margin-top:4px">まだ香りが残っているうちに。</div>' +
      '<a id="recordBtn" class="go" style="margin-top:8px;display:flex;align-items:center;justify-content:center;text-decoration:none"' + (recUrl ? (' href="' + esc(recUrl) + '"') : '') + '>この一杯を残す</a>';
    const areaHtml = '<div id="areaProg" class="areaprog hidden"></div>';

    $("body").innerHTML =
      '<div style="height:8px"></div>' +
      headerHtml +
      recordHtml +
      areaHtml +
      beansProgHtml +
      ticketHtml +
      refHtml;

    // 地域コンプリート進捗＋正しいロゴ（area_progressが logo=R列 と exterior を同梱）。未デプロイ・非対象時は静かに据え置き。
    (async ()=>{
      try{
        const ap = await api("area_progress", { shopId: st.shopId || SPOT || "" });
        if (!ap) return;
        // ロゴは初期表示で自社 shop/<ID>/logo.png を直読み済（→404はexterior→頭文字）。ここは進捗テキストのみ。
        // 進捗テキスト
        if (ap.ok && ap.area){
          $("areaProg").innerHTML = 'あと <b>' + (Number(ap.remaining)||0) + '</b> 店で ' + esc(ap.area) + ' コンプリート（' + (Number(ap.got)||0) + '/' + (Number(ap.total)||0) + '）';
          $("areaProg").classList.remove("hidden");
        }
      }catch(e){ /* 未デプロイ・非対象は何も出さない */ }
    })();

    // バナーをカード先頭に
    const card = document.querySelector(".card");
    const oldB = card.querySelector(".done, #donecard"); if(oldB) oldB.remove();
    card.insertAdjacentHTML("afterbegin", banner);

    // 完了カード画像が無い店は、緑帯にフォールバック（画面が崩れない保険）。
    const dc = document.getElementById("donecard");
    if (dc) dc.onerror = function(){ dc.outerHTML = '<div class="done ci"><div class="ic">✓</div><div class="t">チェックイン完了！</div></div>'; };

    // 記録ボタン：今日の一杯（記録ページ）を開く（LINE内はアプリ内ウィンドウ＝下の紹介ボタンと同じ作法）。
    const rec = document.getElementById("recordBtn");
    if (rec) rec.onclick = function(ev){
      const url = rec.getAttribute("href");
      if (!url) { ev.preventDefault(); return; }
      if (liff.isInClient && liff.isInClient()) { ev.preventDefault(); liff.openWindow({ url: url, external: false }); }
    };

    // 豆割リンク：LINE内はアプリ内ウィンドウで開く（記録ボタン・紹介ボタンと同じ作法）。
    const bl = document.getElementById("beansLink");
    if (bl) bl.onclick = function(ev){
      const url = bl.getAttribute("href");
      if (!url) { ev.preventDefault(); return; }
      if (liff.isInClient && liff.isInClient()) { ev.preventDefault(); liff.openWindow({ url: url, external: false }); }
    };

    // 紹介ボタン：紹介ランディングLIFFを開く（LINE内はアプリ内ウィンドウ）。
    const rb = document.getElementById("refBtn");
    if (rb) rb.onclick = function(){
      // 送る側ページへ「いまチェックインした店ID」を渡す（share は shopId 必須）。
      const url = SHARE_URL + "?shopId=" + encodeURIComponent(st.shopId || SPOT || "");
      if (liff.isInClient && liff.isInClient()) liff.openWindow({ url: url, external: false });
      else location.href = url;
    };

    if (r.ticketEnabled && Number(r.ticketBalance) > 0) wireTicket(Number(r.ticketBalance));
  }

  function wireTicket(bal){
    count = 1;
    const render = ()=>{ $("cnt").textContent = count; $("minus").disabled = busy || count<=1; $("plus").disabled = busy || count>=Math.min(bal,10); $("use").textContent = busy ? "処理中…" : (count+"枚を使う"); };
    $("minus").onclick = ()=>{ if(busy) return; if(count>1){count--; render();} };
    $("plus").onclick  = ()=>{ if(busy) return; if(count<Math.min(bal,10)){count++; render();} };
    $("use").onclick = async ()=>{
      if(busy) return; busy = true; render();
      try{
        const d = await api("use_do", { spotId: st.shopId, count: count });
        busy = false;
        if(!d || !d.ok){
          render();
          const msg = d && d.error === "insufficient" ? "残り枚数が足りません。" : (d && d.error === "not_enabled" ? "この店は試飲チケット対応ではありません。" : "チケットの使用に失敗しました。");
          $("tmsg").className = "msg ng"; $("tmsg").textContent = msg; return;
        }
        renderTicketUsed(d);
      }catch(e){ busy=false; render(); $("tmsg").className="msg ng"; $("tmsg").textContent="通信に失敗しました。もう一度お試しください。"; }
    };
    render();
  }

  // ③ チケット使用後
  function renderTicketUsed(d){
    const card = document.querySelector(".card");
    const oldB = card.querySelector(".done, #donecard"); if(oldB) oldB.remove();
    card.insertAdjacentHTML("afterbegin", '<div class="done" style="background:#BA7517"><div class="ic">🎫</div><div class="t">試飲チケット '+(Number(d.consumedCount)||0)+'枚を使いました</div></div>');
    $("body").innerHTML =
      '<div style="height:8px"></div>' +
      '<div style="text-align:center;font-size:16px;font-weight:800">' + esc(d.shopName || st.shopName) + '</div>' +
      '<div class="total" style="margin-top:6px">残り ' + (Number(d.balanceAfter)||0) + '枚</div>' +
      '<div class="fine" style="margin-top:12px;line-height:1.7">お店の人に画面を見せてください<br>（二重使用は自動で防止）</div>';
    sendReceiptToTalk(d);  // ★使用直後に「控えカード（レシート）」をトークへ1枚置く（入口B=ticket_use.html と同じ・配信枠を使わない無料の送信）
  }

  // ★控えカード（トークに"残る"レシート）——ticket_use.html と同じ見た目・データは use_do 返り値のみ
  function shortWhen(at){
    const m = String(at||"").match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
    if(m) return Number(m[2]) + "/" + Number(m[3]) + " " + m[4] + ":" + m[5];
    const dt = new Date();
    const p2 = n => (n<10?"0":"")+n;
    return (dt.getMonth()+1) + "/" + dt.getDate() + " " + p2(dt.getHours()) + ":" + p2(dt.getMinutes());
  }
  function buildReceiptFlex(d){
    const shop = d.shopName || (st && st.shopName) || "このお店";
    const num = String(Number(d.consumedCount)||0);
    const rest = String(Number(d.balanceAfter)||0);
    const when = shortWhen(d.at);
    const row = (label, value, strong) => ({
      type:"box", layout:"horizontal", margin:"sm",
      contents:[
        { type:"text", text:label, size:"sm", color:"#8c6e50", flex:0 },
        { type:"text", text:value, size:"sm", color:"#332822", align:"end", weight: strong ? "bold" : "regular" }
      ]
    });
    return {
      type:"flex",
      altText:"🎫 試飲チケットを使いました（" + shop + " / " + num + "枚）",
      contents:{
        type:"bubble", size:"kilo",
        header:{ type:"box", layout:"vertical", backgroundColor:"#34595A", paddingAll:"14px",
          contents:[ { type:"text", text:"🎫 試飲チケットを使いました", color:"#ffffff", weight:"bold", size:"md", wrap:true } ] },
        body:{ type:"box", layout:"vertical", paddingAll:"16px",
          contents:[
            { type:"text", text:shop, weight:"bold", size:"lg", color:"#34595A", wrap:true },
            row("使った枚数", num + " 枚", true),
            row("残り", rest + " 枚", false),
            row("使用日時", when, false),
            { type:"separator", margin:"lg", color:"#EFE7D6" },
            { type:"text", margin:"md", size:"xxs", color:"#8c6e50", wrap:true,
              text:"お店の方へ：この控えは記録用です。ご注文の確認はお客様の画面でお願いします。" }
          ] }
      }
    };
  }
  // 控えカードをトークへ"置く"。送れない環境（トーク外・許可未設定）でも黙って諦める＝画面表示は主役。
  async function sendReceiptToTalk(d){
    try{
      if(!(liff.isApiAvailable && liff.isApiAvailable("sendMessages"))) return;
      await liff.sendMessages([ buildReceiptFlex(d) ]);
    }catch(e){}
  }

  function renderNeedRegister(){
    $("hero").classList.add("hidden");
    $("body").innerHTML =
      '<div class="brand">JCJパスポート</div>' +
      '<div class="shop">' + esc(st.shopName) + '</div>' +
      '<div style="text-align:center;margin:12px 0 4px;font-size:15px;font-weight:700;color:var(--ink)">まず登録して、コーヒー旅を始めましょう</div>' +
      '<div class="fine" style="text-align:center;margin:0 0 4px;line-height:1.8;color:var(--muted);font-size:12px">登録すると、このお店に自動でチェックインされます。</div>' +
      '<button id="reg" class="go">はじめる</button>';
    $("reg").onclick = ()=>{
      const oa = "https://line.me/R/ti/p/@957zdear";
      if (liff.isInClient && liff.isInClient()) liff.openWindow({ url: oa, external: false });
      else location.href = oa;
    };
  }

  async function main(){
    showLoading("LINEを起動しています…");
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    const profile = await liff.getProfile();
    USER_ID = profile.userId || "";
    SPOT = params.get("spot") || params.get("spotId") || "";
    if(!USER_ID){ showStatusText("ユーザー情報を取得できませんでした。"); return; }
    if(!SPOT){ showStatusText("店番号がURLにありません。プレートのリンクをご確認ください。"); return; }

    showLoading("お店を確認しています…");
    st = await api("checkin_state", { spot: SPOT });
    if(!st || !st.ok){
      if (st && st.error === "shop_not_found"){ showStatusText("お店が見つかりませんでした。プレートのリンクをご確認ください。"); return; }
      showStatusText("読み込みに失敗しました：" + (st && st.error || "unknown")); return;
    }
    renderPrompt();
  }

  main().catch(err=>{ showStatusText("エラー: " + (err && err.message || String(err))); });
</script>
</body>
</html>
