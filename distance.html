<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>みんなの距離メーター</title>
<style>
  /* JCJ カラー仕様（トンマナ）準拠：白基準・数字は本文色・緑は達成のみ */
  :root{
    --bg:#ffffff;        /* 画面の基本背景（白） */
    --paper:#F4EADD;     /* ベージュ＝カードの"中のブロック"だけに使う */
    --ink:#221C1A;       /* 本文・数字 */
    --ink-sub:#6E655E;   /* 補助テキスト・単位（km/人） */
    --line:#DDD6CE;      /* 枠線・区切り */
    --brand-deep:#C04A55;/* 深コーラルピンク＝押す（今回は使用箇所を限定） */
    --done:#2F7A57;      /* グリーン＝達成・訪問済み（距離メーターの識別色） */
    --track:#E7EAE5;     /* 進捗バーの下地 */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  .wrap{max-width:440px;margin:0 auto;padding:0 16px 18px}

  .status{color:var(--ink-sub);font-size:14px;padding:60px 0;text-align:center}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--done);border-radius:50%;margin:0 auto 12px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none}

  .head{padding:12px 4px 6px;text-align:center}
  .head .kicker{font-size:11px;color:var(--ink-sub);letter-spacing:.10em;font-weight:700}
  .head .h1{font-size:17px;font-weight:800;margin-top:4px;line-height:1.4;color:var(--ink)}

  /* 軸ラベル（みんなの旅／あなたの旅を分ける小見出し） */
  .axis{font-size:11.5px;font-weight:800;color:var(--ink-sub);letter-spacing:.04em;margin:14px 2px 6px}
  .axis:first-child{margin-top:6px}

  /* ── みんなの旅（全体軸）＝白カード ── */
  .meter{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px;text-align:center;box-shadow:0 4px 16px rgba(80,70,60,.06)}
  .meter .globe{font-size:20px;line-height:1}
  /* 進行中の数字＝本文色（--ink）。達成したときだけ .big.done で緑にする */
  .meter .big{font-size:33px;font-weight:800;color:var(--ink);line-height:1.05;margin-top:1px;letter-spacing:-.01em;transition:color .3s ease}
  .meter .big.done{color:var(--done)}
  .meter .big .u{font-size:15px;font-weight:800;color:var(--ink-sub);margin-left:3px}
  .meter .cap{font-size:12px;color:var(--ink-sub);margin-top:3px;font-weight:700}

  .track{margin-top:11px;height:10px;background:var(--track);border-radius:999px;overflow:hidden}
  .fill{height:10px;background:var(--done);border-radius:999px;width:0;transition:width .8s ease}
  .goal{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--ink-sub);font-weight:700}
  /* 残り＝進行中は本文色寄り。達成したときだけ .remain.done で緑 */
  .remain{margin-top:9px;font-size:13.5px;font-weight:800;color:var(--ink)}
  .remain.done{color:var(--done)}

  /* 仲間の数＝全体軸の一部。カード内のベージュ小ブロックに置く */
  .members{margin-top:12px;background:var(--paper);border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:6px}
  .members .l{font-size:12px;color:var(--ink-sub);font-weight:700}
  .members .v{font-size:18px;color:var(--ink);font-weight:800}
  .members .v .u{font-size:12px;color:var(--ink-sub);font-weight:800;margin-left:2px}

  /* ── あなたの旅（個人軸）＝別カードで軸を分ける ── */
  .you{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:13px 16px}
  .you .inner{background:var(--paper);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
  .you .l{font-size:13px;color:var(--ink-sub);font-weight:800}
  .you .v{font-size:26px;color:var(--ink);font-weight:800;line-height:1}
  .you .v .u{font-size:13px;color:var(--ink-sub);font-weight:800;margin-left:2px}
  .you .note{font-size:11px;color:var(--ink-sub);margin-top:8px;line-height:1.5;text-align:center}

  /* 数字が届くまでの「くるくる」（枠は先に見えている・数字が入る場所で回る） */
  .miniSpin{display:inline-block;width:.8em;height:.8em;border:2px solid var(--line);border-top-color:var(--done);border-radius:50%;vertical-align:-.06em;animation:spin .8s linear infinite}
  /* メーターのバーも、届くまでは緑の帯が左右に流れる（読み込み中の合図） */
  .track.loading{position:relative}
  .track.loading .fill{width:0 !important}
  .track.loading::after{content:"";position:absolute;top:0;height:100%;width:30%;border-radius:999px;background:var(--done);opacity:.35;animation:track-slide 1.15s ease-in-out infinite}
  @keyframes track-slide{0%{left:-32%}100%{left:100%}}

  /* 憧れ（夢・演出のみ／実物の約束はしない） */
  .dream{margin-top:14px;background:#14213a;color:#eaf0f7;border-radius:14px;padding:11px 14px;text-align:center}
  .dream .moon{font-size:16px;line-height:1}
  .dream .t{font-size:13.5px;font-weight:800;margin-top:3px;line-height:1.5}
  .dream .s{font-size:11.5px;color:#c7d3e4;margin-top:6px;font-weight:700}
  .moontrack{margin-top:6px;height:7px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}
  .moonfill{height:7px;background:#9fb4d6;border-radius:999px;width:0;transition:width .9s ease}
  .moonremain{font-size:11px;color:#b9c6d8;margin-top:6px;line-height:1.5}

  /* 次の一歩 */
  .next{margin-top:14px}
  .next .ttl{font-size:12.5px;font-weight:800;color:var(--ink-sub);margin:0 2px 7px}
  .shop{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .shop .photo{position:relative;height:118px;background:var(--paper)}
  .shop .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .shop .badge{position:absolute;left:10px;top:10px;background:rgba(47,122,87,.92);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
  .shop .dist{position:absolute;right:10px;bottom:10px;background:var(--done);color:#fff;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
  .shop .body{padding:10px 14px 12px}
  .shop .pref{font-size:12px;color:var(--ink-sub);font-weight:700}
  .shop .name{font-size:18px;font-weight:800;margin-top:2px;line-height:1.3;color:var(--ink)}
  .shop .roaster{font-size:12px;color:var(--ink-sub);margin-top:2px}
  .photo .noimg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-sub);text-align:center;padding:0 16px}
  .photo .noimg .ic{font-size:26px}
  .photo .noimg .nm{font-size:16px;font-weight:800;margin-top:4px;line-height:1.3;color:var(--ink)}
  .nextEmpty{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;font-size:13px;color:var(--ink-sub);line-height:1.7}

  .btn{display:block;width:100%;height:48px;line-height:48px;text-align:center;border-radius:12px;border:none;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;margin-top:10px}
  /* 主ボタン＝押す＝深コーラルピンク（トンマナ：押す=ピンク） */
  .btn.primary{background:var(--brand-deep);color:#fff;box-shadow:0 6px 16px rgba(192,74,85,.24)}
  .btn.ghost{background:transparent;color:var(--brand-deep);border:1.5px solid var(--brand-deep);height:44px;line-height:42px;font-size:14px}

  .foot{margin-top:12px;text-align:center;font-size:10.5px;color:var(--ink-sub);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <div id="status" class="status">
    <div id="spin" class="spin"></div>
    <div id="statusText">起動中…</div>
  </div>

  <div id="main" class="hidden">
    <div class="head">
      <div class="kicker">JAPAN COFFEE JOURNEY</div>
      <div class="h1">みんなで旅した距離</div>
    </div>

    <!-- ── みんなの旅（全体軸）── -->
    <div class="axis">🌏 みんなの旅</div>
    <div class="meter">
      <div class="globe">🌏</div>
      <div class="big"><span id="totalKm"><i class="miniSpin"></i></span><span class="u">km</span></div>
      <div class="cap">日本中の旅人が足した距離の合計</div>

      <div id="track" class="track loading"><div id="fill" class="fill"></div></div>
      <div class="goal">
        <span id="asOf">今日</span>
        <span id="goalLabel">地球一周 40,075km</span>
      </div>
      <div id="remain" class="remain"></div>

      <div class="members">
        <span class="l">いっしょに旅する仲間</span>
        <span class="v"><span id="members"><i class="miniSpin"></i></span><span class="u">人</span></span>
      </div>
    </div>

    <!-- ── あなたの旅（個人軸）＝全体とは別カードで分ける ── -->
    <div class="axis">🚶 あなたの旅</div>
    <div class="you">
      <div class="inner">
        <span class="l">あなたが足した距離</span>
        <span class="v"><span id="yourKm"><i class="miniSpin"></i></span><span class="u">km</span></span>
      </div>
      <div class="note">あなたのチェックインが、みんなの旅を前に進めます。</div>
    </div>

    <div class="dream">
      <div class="moon">🌙</div>
      <div class="t">いつか、日本のコーヒー旅を宇宙へ。</div>
      <div class="s">月を目指して</div>
      <div class="moontrack"><div id="moonfill" class="moonfill"></div></div>
      <div class="moonremain" id="moonRemain"></div>
    </div>

    <div class="next">
      <div class="ttl" id="nextTtl">次の一歩</div>
      <div id="nextLoading" class="nextEmpty">近くのお店を探しています…</div>

      <div id="shop" class="shop hidden">
        <div class="photo">
          <img id="photo" alt="お店の写真">
          <div id="noimg" class="noimg hidden"><div class="ic">🫘</div><div class="nm" id="noimgName"></div></div>
          <div class="badge" id="shopBadge">行きたいに保存中</div>
          <div id="dist" class="dist hidden"></div>
        </div>
        <div class="body">
          <div id="pref" class="pref"></div>
          <div id="name" class="name"></div>
          <div id="roaster" class="roaster"></div>
        </div>
      </div>

      <div id="nextEmpty" class="nextEmpty hidden">気になるロースターを「行きたい」に保存すると、ここに次の一歩が出ます。</div>

      <a id="mapBtn" class="btn primary hidden" target="_blank" rel="noopener">このお店への行き方を見る</a>
      <button id="findBtn" class="btn ghost hidden">ロースターを探す</button>
    </div>

    <div class="foot">数字は毎朝1回の集計です。<br>（スタッフ・テスト用の記録は合計に含めていません）</div>
  </div>

</div>

<!-- LINE SDKは本文の“後”に置く＝画面(枠/くるくる)を先に描いてから読み込む（真っ白を防ぐ） -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // ===== 設定ここだけ（テスト環境）=====
  // LIFF_ID：この距離メーター用に LINE Developers で作成するLIFFアプリID（テストのログインチャネル 2008851980 配下）。
  const LIFF_ID = "2008851980-esv1Ko37"; // 距離メーター用LIFF（テスト・2026-08-23作成）
  // GAS_URL：distance_meter / saved_nudge を含む「誰でもアクセス可（ログイン不要）」のバージョン付きデプロイURL。
  //          ※本部の再配備でこのメーター対応版に更新される（デプロイURL自体は版固定で不変）。
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4ZUF9vdBoIz34-NgD927HpzQTjbD8xdK3XZ7hD1_X_5ZAHgTvmK08uB6bzB_MQByV/exec";
  // FIND_URL：「ロースターを探す」導線（保存が無い/全部行った人向け）。
  //   OA(テスト @957zdear)に「ロースターを探す」メッセージを送る＝GAS側 userText.includes("ロースターを探す") で検索起動。
  const FIND_URL = "https://line.me/R/oaMessage/@957zdear/?" + encodeURIComponent("ロースターを探す");
  // ====================================

  const $ = id => document.getElementById(id);
  let USER_ID = "";

  function showLoading(msg){ $("status").classList.remove("hidden"); $("spin").classList.remove("hidden"); $("statusText").textContent = msg; $("main").classList.add("hidden"); }
  function showStatusText(msg){ $("status").classList.remove("hidden"); $("spin").classList.add("hidden"); $("statusText").textContent = msg; $("main").classList.add("hidden"); }

  // ⚡️体感速度：枠（メーター）を先に出す。数字は取得後に流し込む。
  function revealFrame(){ $("status").classList.add("hidden"); $("main").classList.remove("hidden"); }

  // ⚡️前回この端末で見た数字を覚えておき、次回オープンで“即”表示する（裏で最新に差し替え）。
  //   ・端末＋ユーザー単位で保存。プライベートモード等で使えなくても本体は普通に動く（try/catch）。
  const DM_CACHE_KEY = "dm_snap_v1:";
  const DM_LAST_KEY  = "dm_snap_v1:last";   // userId非依存の“最終スナップ”＝LINE起動を待たず開いた瞬間に描くため
  function loadCachedMeter(){
    try{ const raw = localStorage.getItem(DM_CACHE_KEY + USER_ID); return raw ? JSON.parse(raw) : null; }catch(_){ return null; }
  }
  function loadLastMeter(){
    try{ const raw = localStorage.getItem(DM_LAST_KEY); return raw ? JSON.parse(raw) : null; }catch(_){ return null; }
  }
  function saveCachedMeter(d){
    const snap = JSON.stringify({ ok:true, totalKm:d.totalKm, goalKm:d.goalKm, memberCount:d.memberCount, yourKm:d.yourKm, updatedAt:d.updatedAt });
    try{ localStorage.setItem(DM_CACHE_KEY + USER_ID, snap); }catch(_){}
    try{ localStorage.setItem(DM_LAST_KEY, snap); }catch(_){}   // 次回“開いた瞬間”用（誰の端末かに依存しない）
  }

  async function api(action, extra){
    const q = new URLSearchParams(Object.assign({ action:action, userId:USER_ID, _:Date.now() }, extra||{}));
    const res = await fetch(GAS_URL + "?" + q.toString(), { method:"GET" });
    return await res.json();
  }

  const MOON_KM = 384400; // 地球〜月の距離（憧れのゴール・演出のみ）

  function fmt(n){ return (Number(n)||0).toLocaleString(); }

  function renderMeter(d){
    const total = Number(d.totalKm)||0;
    const goal  = Number(d.goalKm)||40075;
    const you   = Number(d.yourKm)||0;
    const pct   = Math.max(0, Math.min(100, goal>0 ? (total/goal*100) : 0));
    // 周回対応：地球一周(EARTH)を基準に、目標が何周ぶんか(goalLaps)を出す。
    const EARTH = 40075;                                     // 地球一周(km)
    const goalLaps = Math.max(1, Math.round(goal / EARTH));  // 目標の周回数(80150→2周)
    const lapped = total >= EARTH;   // 地球一周を達成したか（＝祝う色=緑にする境目）

    // 数字が届いた＝各所の「くるくる」を数字に差し替え、バーの読み込み帯を止める
    $("totalKm").textContent = fmt(total);
    $("yourKm").textContent  = fmt(you);
    $("members").textContent = fmt(d.memberCount);
    $("goalLabel").textContent = "地球" + (goalLaps > 1 ? goalLaps + "周" : "一周") + " " + fmt(goal) + "km";
    $("track").classList.remove("loading");
    setTimeout(()=>{ $("fill").style.width = (pct>0?pct:1) + "%"; }, 60);

    // 数字の「時点」＝今日の日付（集計日があればそれ、無ければ今日）
    const asOf = d.updatedAt ? new Date(d.updatedAt) : new Date();
    $("asOf").textContent = (asOf.getMonth()+1) + "月" + asOf.getDate() + "日時点";

    // 周回対応：一周でも達成したら祝う色（.done＝緑）を数字と残りに付ける（緑は達成のみ）
    if (lapped){
      $("totalKm").parentElement.classList.add("done");
      $("remain").classList.add("done");
    } else {
      $("totalKm").parentElement.classList.remove("done");
      $("remain").classList.remove("done");
    }
    if (total >= goal){
      $("remain").textContent = "🎉 地球" + goalLaps + "周 達成！";
    } else if (total >= EARTH){
      $("remain").textContent = "🎉 地球一周 達成！ 地球" + goalLaps + "周まで あと約 " + fmt(goal - total) + "km";
    } else {
      $("remain").textContent = "地球一周まで あと約 " + fmt(goal - total) + "km";
    }

    // 🌙 月を目指すバー（地球〜月＝384,400km。今はごく僅か＝憧れの演出）
    const moonPct = Math.max(0, Math.min(100, total/MOON_KM*100));
    setTimeout(()=>{ $("moonfill").style.width = (moonPct>0?moonPct:0.5) + "%"; }, 120);
    $("moonRemain").textContent = "月まで あと約 " + fmt(Math.max(0, MOON_KM - total)) + "km";
  }

  function renderNext(you, nudge){
    $("nextLoading").classList.add("hidden");   // 読み込み表示を消す
    const t = nudge && nudge.ok ? nudge.target : null;
    if (t){
      // 0kmの人は「最寄りの保存店」、行ったことがある人は「次に行きたい保存店」
      $("nextTtl").textContent = (you > 0) ? "次に行きたい、保存したお店" : "あなたの旅の、はじめの一歩に";
      $("shopBadge").textContent = "行きたいに保存中";
      $("name").textContent = t.name || "お店";
      $("pref").textContent = t.pref || "";
      $("roaster").textContent = t.roaster || "";
      // 写真が無い/読めない店は、色地に店名を出して“空っぽ”に見せない
      const showNoImg = ()=>{ $("photo").style.display="none"; $("noimgName").textContent = t.name || "お店"; $("noimg").classList.remove("hidden"); };
      if (t.photo){ $("photo").style.display=""; $("noimg").classList.add("hidden"); $("photo").onerror=showNoImg; $("photo").src=t.photo; }
      else { showNoImg(); }
      if (t.distanceKm != null){ $("dist").textContent = "約 " + t.distanceKm + "km"; $("dist").classList.remove("hidden"); }
      $("shop").classList.remove("hidden");
      if (t.mapUrl){ $("mapBtn").href = t.mapUrl; $("mapBtn").classList.remove("hidden"); }
    } else {
      // 保存がまだ無い／全部行った人：空にせず、探す導線を出す
      $("nextTtl").textContent = "次の一歩";
      $("nextEmpty").classList.remove("hidden");
      if (FIND_URL){ $("findBtn").onclick = ()=>{ location.href = FIND_URL; }; $("findBtn").classList.remove("hidden"); }
    }
  }

  async function load(){
    // ⚡️前回この端末で見た数字があれば、まず“即”表示（枠だけでなく数字も先に出す）。
    const cached = loadCachedMeter();
    if (cached && cached.ok){ renderMeter(cached); }

    // 距離集計と保存店ナッジを"同時に"取りに行く（順番待ちを無くす）。
    const pMeter = api("distance_meter");
    const pNudge = api("saved_nudge").catch(()=>null);   // 失敗しても本体は出す

    // 最新が返ったら数字を差し替え＆この端末に保存（次回オープンの“即表示”用）。
    const d = await pMeter;
    if(d && d.ok){
      renderMeter(d);
      saveCachedMeter(d);
    } else if(!cached){
      // 最新が取れず、前回の控えも無い時だけエラー表示（控えがあればその表示を保つ）。
      showStatusText("読み込みに失敗しました。時間をおいてお試しください。"); return;
    }

    // 「次の一歩」の店は、少し遅れて埋める（メーター表示は待たせない）。
    const nudge = await pNudge;
    renderNext(Number((d && d.yourKm) || (cached && cached.yourKm) || 0), nudge);
  }

  // ⚡️開いた“瞬間”に枠を描く（LINE起動やGAS応答を待たない＝真っ白を防ぐ）。
  //   前回この端末で見た“みんなの数字”があれば即描画。個人kmはLINE起動後に正す。
  function prepaint(){
    try{
      revealFrame();
      const last = loadLastMeter();
      if (last && last.ok) renderMeter(last);
    }catch(_){}
  }

  async function main(){
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isInClient()){ showStatusText("LINEアプリの中で開いてください。"); return; }
    if (!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
    const profile = await liff.getProfile();
    USER_ID = profile.userId || "";
    if(!USER_ID){ showStatusText("ユーザー情報を取得できませんでした。"); return; }
    await load();   // 枠はprepaintで先出し済み＝ここでは数字の取得・差し替えだけ
  }

  prepaint();   // ← まず枠を即描画（真っ白回避）。この後でLINE起動→数字取得。
  main().catch(err=>{ showStatusText("エラー: " + (err && err.message || String(err))); });
</script>
</body>
</html>
