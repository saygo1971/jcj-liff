<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JCJ Share</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;margin:20px;line-height:1.6}
    .card{border:1px solid #e6e6e6;border-radius:14px;padding:14px}
    .ok{color:#0a7a25;font-weight:800}
    .ng{color:#b00020;font-weight:800}
    .muted{color:#666;font-size:12px;word-break:break-all}
  </style>
</head>
<body>
  <div class="card">
    <div id="status" class="muted">起動中…</div>
  </div>

<script>
  const LIFF_ID = "2008851980-V8WaCaZw";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx4ZUF9vdBoIz34-NgD927HpzQTjbD8xdK3XZ7hD1_X_5ZAHgTvmK08uB6bzB_MQByV/exec";

  const el = (id) => document.getElementById(id);

  function setStatus(text, ok = null) {
    el("status").innerHTML =
      ok === true  ? `<span class="ok">✅</span> ${text}` :
      ok === false ? `<span class="ng">❌</span> ${text}` :
      text;
  }

  // NFC/QRやliff.state経由で入るケースも拾う
  function getParam(name) {
    const u = new URL(location.href);
    const direct = u.searchParams.get(name);
    if (direct) return direct;

    const st = u.searchParams.get("liff.state");
    if (st) {
      try {
        const s = st.startsWith("?") ? st.slice(1) : st;
        const p = new URLSearchParams(s).get(name);
        if (p) return p;
      } catch (e) {}
    }
    return "";
  }

  async function main() {
    const shopId = (getParam("shopId") || "").trim();

    if (!shopId) {
      setStatus("店舗情報を取得できませんでした。", false);
      return;
    }

    await liff.init({ liffId: LIFF_ID });

    if (!liff.isInClient()) {
      setStatus("LINE内で開いてください。", false);
      return;
    }

    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href });
      return;
    }

    if (!liff.isApiAvailable("shareTargetPicker")) {
      let granted = "(取得失敗)";
      try {
        granted = JSON.stringify(await liff.permission.getGrantedAll());
      } catch (e) {
        granted = "(取得失敗: " + (e?.message || String(e)) + ")";
      }

      setStatus(
        "この環境ではLINE共有を利用できません。<br>" +
        "OS: " + liff.getOS() + "<br>" +
        "LIFF SDK: " + liff.getVersion() + "<br>" +
        "LINE ver: " + liff.getLineVersion() + "<br>" +
        "isInClient: " + liff.isInClient() + "<br>" +
        "付与済み権限: " + granted,
        false
      );
      return;
    }

    setStatus("紹介リンクを準備しています…");

    const profile = await liff.getProfile();

    const createShareUrl = GAS_URL + "?" + new URLSearchParams({
      action: "create_share",
      spotId: shopId,
      referrerUserId: profile.userId,
      source: "saved_card"
    }).toString();

    const res = await fetch(createShareUrl);
    const data = await res.json();

    if (data.error) {
      setStatus("紹介リンクの発行に失敗しました。", false);
      return;
    }

    setStatus("送る相手を選んでください。");

    const shareMessage = data.shopName + "、一緒に行きませんか？\n\n" + data.shareUrl;

    const result = await liff.shareTargetPicker([
      { type: "text", text: shareMessage }
    ]);

    if (result) {
      setStatus("送信しました。", true);
    } else {
      setStatus("送信をキャンセルしました。");
    }
  }

  main().catch(e => {
    setStatus("エラー: " + (e?.message || String(e)), false);
  });
</script>
</body>
</html>
