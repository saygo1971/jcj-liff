<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>お店の成績（JCJ 送客レポート）</title>
  <style>
    :root{ --brand:#0F6E56; --brand-d:#085041; --brand-l:#E1F5EE; --brand-l2:#9FE1CB; --line:#e6e6e6; --muted:#666; --hint:#999; }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;margin:0;background:#f4f4f2;color:#222}
    .wrap{max-width:480px;margin:0 auto;padding:14px}
    .head{background:var(--brand);color:#fff;border-radius:16px 16px 0 0;padding:16px}
    .head .sub{color:var(--brand-l);font-size:12px}
    .head .ttl{font-size:18px;font-weight:700;margin-top:3px}
    .head .period{color:var(--brand-l2);font-size:12px;margin-top:3px}
    .card{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 16px 16px;padding:18px 16px}
    .lead{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px}
    .stat{display:flex;align-items:stretch;gap:14px;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
    .stat .bar{width:4px;border-radius:4px;background:var(--brand);flex:none}
    .stat .txt{flex:1;align-self:center}
    .stat .lbl{font-size:15px;color:var(--brand-d);font-weight:700}
    .stat .desc{font-size:12px;color:var(--hint);margin-top:2px}
    .stat .num{align-self:center;font-size:30px;font-weight:800;color:#221C1A;line-height:1}
    .stat .num .u{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px}
    .statbox{background:#fafafa;border:1px solid var(--brand-l2);border-radius:12px;padding:14px 16px;margin-bottom:10px}
    .tapgrid{display:grid;gap:6px;margin-top:12px}
    .tapgrid .cell{background:#fff;border-radius:8px;padding:8px 4px;text-align:center}
    .tapgrid .cell .k{font-size:11px;color:var(--hint)}
    .tapgrid .cell .v{font-size:16px;font-weight:700;color:#221C1A}
    .note{background:#FAEEDA;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:12px;color:#633806;line-height:1.7}
    .foot{margin-top:14px;font-size:11px;color:var(--hint);text-align:center;line-height:1.7}
    .status{color:var(--muted);font-size:13px;padding:34px 0;text-align:center}
    .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none}
    pre{background:#f6f6f6;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="sub">Japan Coffee Journey ・ 送客レポート</div>
    <div class="ttl"><span id="shopName">お店</span></div>
    <div class="period" id="period">累計</div>
  </div>

  <div class="card">
    <div id="status" class="status">
      <div id="spin" class="spin"></div>
      <div id="statusText">読み込んでいます…</div>
    </div>

    <div id="main" class="hidden">
      <div class="lead">JCJアプリ経由で、あなたのお店にこれだけの動きがありました。</div>

      <div class="stat">
        <div class="bar"></div>
        <div class="txt">
          <div class="lbl">行きたい保存</div>
          <div class="desc">「行ってみたい」と保存した人</div>
        </div>
        <div class="num"><span id="saved">0</span><span class="u">人</span></div>
      </div>

      <div class="stat">
        <div class="bar"></div>
        <div class="txt">
          <div class="lbl">ご来店（実人数）</div>
          <div class="desc">実際にチェックインした人</div>
        </div>
        <div class="num"><span id="visited">0</span><span class="u">人</span></div>
      </div>

      <div class="stat">
        <div class="bar"></div>
        <div class="txt">
          <div class="lbl">リピーター</div>
          <div class="desc">2回以上来てくれた人</div>
        </div>
        <div class="num"><span id="repeat">0</span><span class="u">人</span></div>
      </div>

      <div class="statbox">
        <div class="stat" style="border:none;background:none;padding:0;margin:0">
          <div class="bar"></div>
          <div class="txt">
            <div class="lbl">外部リンクのタップ</div>
            <div class="desc">お店のSNSやサイトを見に行った回数</div>
          </div>
          <div class="num"><span id="tapTotal">0</span><span class="u">回</span></div>
        </div>
        <div class="tapgrid" id="tapGrid"></div>
      </div>

      <div class="foot">
        このページはあなたのお店だけの専用リンクです。URLを他の人に教えないようご注意ください。<br>
        <span id="updated"></span>
      </div>
    </div>

    <pre id="debug" class="hidden"></pre>
  </div>
</div>

<script>
  // ===== 設定ここだけ（テスト環境）=====
  // GAS_URL：成績ページ"専用"の doGet 窓口（テスト）。LINEのwebhook(@458)とは別デプロイ＝LINE無影響。
  //          roaster_stats を含む @459 で配信。本番化時は本番GASの成績専用/execに差し替えること。
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxyJsWX23vyYZuyQe0B2Hyx32qrewd3-LGJXXuOFTIgJtCNKyJP7ZHsVCFpXgn9XcKe/exec";
  // ====================================

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const KEY = (params.get("k") || "").trim();
  const debugMode = (params.get("debug") || "") === "1";

  function showStatus(msg){ $("status").classList.remove("hidden"); $("spin").classList.add("hidden"); $("statusText").textContent = msg; $("main").classList.add("hidden"); }
  function showDebug(o){ if(!debugMode) return; $("debug").classList.remove("hidden"); $("debug").textContent = typeof o==="string"?o:JSON.stringify(o,null,2); }

  function render(d){
    $("shopName").textContent = d.shopName || "お店";
    if (d.period) $("period").textContent = d.period;
    $("saved").textContent   = (d.saved   != null) ? d.saved   : "0";
    $("visited").textContent = (d.visited != null) ? d.visited : "0";
    $("repeat").textContent  = (d.repeat  != null) ? d.repeat  : "0";

    const taps = d.taps || { total: 0, breakdown: [] };
    $("tapTotal").textContent = Number(taps.total) || 0;
    const bd = Array.isArray(taps.breakdown) ? taps.breakdown : [];
    const grid = $("tapGrid");
    if (bd.length === 0){
      grid.style.display = "none";
    } else {
      grid.style.display = "grid";
      grid.style.gridTemplateColumns = "repeat(" + bd.length + ",1fr)";
      grid.innerHTML = bd.map(function(b){
        return '<div class="cell"><div class="k">'+ b.label +'</div><div class="v">'+ (Number(b.count)||0) +'</div></div>';
      }).join("");
    }

    $("updated").textContent = d.updatedYmd ? ("更新：" + d.updatedYmd) : "";
    $("status").classList.add("hidden");
    $("main").classList.remove("hidden");
  }

  async function load(){
    if (!KEY){ showStatus("リンクが正しくありません。お店専用のリンクからもう一度お開きください。"); return; }
    try{
      const q = new URLSearchParams({ action:"roaster_stats", k:KEY, _:Date.now() });
      const res = await fetch(GAS_URL + "?" + q.toString(), { method:"GET" });
      const d = await res.json();
      showDebug(d);
      if(!d.ok){
        if (d.error === "invalid_key") showStatus("このリンクは無効です。お店専用のリンクをご確認ください。");
        else if (d.error === "missing_key") showStatus("リンクが正しくありません。お店専用のリンクからお開きください。");
        else if (d.error === "not_ready") showStatus("成績はただいま準備中です。もうしばらくお待ちください。");
        else showStatus("読み込みに失敗しました。時間をおいてもう一度お試しください。");
        return;
      }
      render(d);
    } catch(err){
      showStatus("通信に失敗しました。電波の良い場所でもう一度お試しください。");
      showDebug(String(err));
    }
  }

  load();
</script>
</body>
</html>
