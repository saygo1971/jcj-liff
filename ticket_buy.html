<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試飲チケット</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #FBF7EF; margin: 0; padding: 20px 16px 40px; color: #5a4632; }
    .wrap { max-width: 420px; margin: 0 auto; }
    #status { text-align: center; color: #8c6e50; font-size: 14px; margin-bottom: 12px; white-space: pre-wrap; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 24px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #E0D2B8; border-top-color: #8a6d4b; border-radius: 50%; animation: spin 0.8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 600; margin: 4px 0 6px; }
    .lead { font-size: 13px; color: #8c6e50; line-height: 1.7; margin: 0 0 18px; }
    .opt { background: #fff; border: 1px solid #E0D2B8; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .opt.selected { border: 2px solid #8a6d4b; }
    .opt .name { font-size: 15px; font-weight: 600; color: #5a4632; display: flex; align-items: center; gap: 6px; }
    .opt .sub { font-size: 12px; color: #8c6e50; margin-top: 3px; }
    .opt .price { font-size: 18px; font-weight: 600; color: #34595A; }
    .badge { background: #D85A30; color: #fff; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
    .strike { text-decoration: line-through; color: #b7a184; }
    .terms { background: #F3EBDD; border-radius: 10px; padding: 12px 14px; margin: 14px 0 0; color: #7a6247; font-size: 12px; line-height: 1.9; }
    button#payBtn { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; border: none; border-radius: 10px; background: #8a6d4b; color: #fff; cursor: pointer; margin-top: 16px; }
    button#payBtn:disabled { background: #c9bba7; cursor: default; }
    .foot { text-align: center; color: #a08a6d; font-size: 11px; margin-top: 10px; line-height: 1.7; }
    .notice { background: #fff; border: 1px solid #E0D2B8; border-radius: 12px; padding: 20px; text-align: center; font-size: 14px; line-height: 1.8; }
    .hidden { display: none; }
    .done-num { font-size: 28px; font-weight: 600; color: #34595A; }
    .backBtn { display: block; width: 100%; box-sizing: border-box; padding: 13px; margin-top: 18px; font-size: 15px; font-weight: 600; text-align: center; text-decoration: none; border: none; border-radius: 10px; background: #34595A; color: #fff; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="status"><span class="spinner" id="spinner"></span><span id="status-text">読み込み中...</span></div>

  <div id="buy" class="hidden">
    <h1>試飲チケット</h1>
    <p class="lead">全国の加盟ロースターで、試飲の一杯に。旅の途中でどうぞ。</p>

    <div class="opt selected" id="opt-pack" data-key="pack">
      <div>
        <div class="name">基本パック <span id="pack-badge" class="badge hidden">今だけ +1杯</span></div>
        <div class="sub" id="pack-sub">6枚セット</div>
      </div>
      <div class="price" id="pack-price">¥1,500</div>
    </div>

    <div class="opt" id="opt-bara" data-key="bara">
      <div>
        <div class="name">バラ</div>
        <div class="sub">1枚</div>
      </div>
      <div class="price" id="bara-price">¥350</div>
    </div>

    <div class="terms">
      <div>発行から<span id="expiry-days">180</span>日間 有効</div>
      <div>1枚で試飲 1杯 と交換</div>
    </div>

    <button id="payBtn">決済に進む</button>
    <div class="foot">Stripeで安全に決済します<br><span id="test-note">テスト環境：実際の請求は発生しません</span></div>
  </div>

  <div id="closed" class="notice hidden">
    ただいま試飲チケットの購入を停止しています。<br>時間をおいて、もう一度お試しください。
  </div>

  <div id="result" class="notice hidden"></div>
</div>

<script>
  // ★このLIFFの設定★
  const LIFF_ID = "2008851980-trDQgLA1";
  // GAS_URL：買う窓口(?action=buy_*)がある配備＝@413（テスト専用・誰でも可）。本番化時に差し替え。
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzoGKzwf2P4pxF1QHjIqg1udwQ6gGnhQcRFnApPWzleHDJuRrMQRNKoYXzrOgomnQoj/exec";
  // 「パスポートに戻る」＝この買う画面(LIFF)を閉じて元のトーク(パスポートのカードがある場所)へ戻す。
  // パスポートはWebページでなくトーク内のFlexカードのため、URL遷移ではなく liff.closeWindow() を使う。
  const backBtnHtml = '<button type="button" class="backBtn" onclick="backToPassport()">パスポートで確認する</button>';

  let currentUserId = "";
  let currentUserName = "";
  let selectedKey = "pack";
  let campaignActive = false;

  const $ = (id) => document.getElementById(id);
  // loading=true のときだけ くるくる を出す（エラー文言では出さない）
  const setStatus = (t, loading = true) => {
    $("status-text").textContent = t || "";
    $("spinner").classList.toggle("hidden", !(loading && t));
    // #status はID指定(display:flex)が.hiddenより強く勝つため、確実に効くインライン指定で出し入れする
    $("status").style.display = t ? "flex" : "none";
  };
  const hideStatus = () => { $("status").style.display = "none"; };
  const yen = (n) => "¥" + Number(n).toLocaleString();
  const getParam = (name) => new URLSearchParams(window.location.search).get(name) || "";

  async function fetchJson(query) {
    // 15秒で時間切れ（無限にくるくる回り続けるのを防ぐ）
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(GAS_URL + query, { method: "GET", signal: ctrl.signal });
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  // 「パスポートに戻る」：トークへ「パスポートを見る」を送る(可能なら)→この画面を閉じて元のトークへ戻す。
  // 何が起きても最後に必ず closeWindow を試みる頑丈な作り（送信不可でも閉じるだけは実行）。
  async function backToPassport() {
    try { await liff.init({ liffId: LIFF_ID }); } catch (e) {}
    try {
      if (liff.isApiAvailable && liff.isApiAvailable("sendMessages")) {
        await liff.sendMessages([{ type: "text", text: "パスポートを見る" }]);
      }
    } catch (e) {}
    try { liff.closeWindow(); } catch (e) {}
  }
  window.backToPassport = backToPassport;

  function runCancelStage() {
    hideStatus();
    $("result").classList.remove("hidden");
    $("result").innerHTML = 'お支払いは行われませんでした。<br>もう一度お試しになる場合は「試飲チケットを買う」からどうぞ。' + backBtnHtml;
  }

  async function runConfirmStage(sessionId) {
    setStatus("お支払いを確認しています…", true);
    try {
      const data = await fetchJson("?action=buy_confirm&session_id=" + encodeURIComponent(sessionId));
      hideStatus();
      const box = $("result");
      box.classList.remove("hidden");
      if (data.ok && data.issued > 0) {
        box.innerHTML = '<div class="done-num">' + data.issued + '枚</div>試飲チケットを受け取りました。<br>パスポートでいつでも確認できます。' + backBtnHtml;
      } else if (data.ok && data.already) {
        box.innerHTML = 'このお支払いのチケットは、すでに受け取り済みです。' + backBtnHtml;
      } else {
        box.innerHTML = 'お支払いの確認ができませんでした。<br>チケットが増えていない場合は、お手数ですがお問い合わせください。' + backBtnHtml;
      }
    } catch (err) {
      hideStatus();
      $("result").classList.remove("hidden");
      $("result").innerHTML = "確認中にエラーが発生しました。時間をおいてお試しください。" + backBtnHtml;
    }
  }

  function renderPrices(data) {
    campaignActive = !!data.campaignActive;
    $("expiry-days").textContent = data.expiryDays;
    $("pack-price").textContent = yen(data.pack.price);
    $("bara-price").textContent = yen(data.bara.price);
    if (!data.testMode) $("test-note").textContent = "";
    if (campaignActive) {
      $("pack-badge").classList.remove("hidden");
      $("pack-sub").innerHTML = '<span class="strike">' + data.pack.baseCount + '枚</span> → ' + data.pack.count + '枚セット';
    } else {
      $("pack-sub").textContent = data.pack.count + "枚セット";
    }
  }

  function selectOpt(key) {
    selectedKey = key;
    $("opt-pack").classList.toggle("selected", key === "pack");
    $("opt-bara").classList.toggle("selected", key === "bara");
  }

  async function goCheckout() {
    $("payBtn").disabled = true;
    setStatus("決済ページを開いています…", true);
    try {
      const data = await fetchJson(
        "?action=buy_checkout" +
        "&userId=" + encodeURIComponent(currentUserId) +
        "&userName=" + encodeURIComponent(currentUserName) +
        "&product=" + encodeURIComponent(selectedKey));
      if (data && data.ok && data.url) {
        window.location.href = data.url;
      } else {
        $("payBtn").disabled = false;
        setStatus("決済ページを開けませんでした。時間をおいてお試しください。", false);
      }
    } catch (err) {
      $("payBtn").disabled = false;
      setStatus("通信に失敗しました。時間をおいてお試しください。", false);
    }
  }

  async function loadState() {
    setStatus("価格を読み込んでいます…", true);
    const data = await fetchJson("?action=buy_state&userId=" + encodeURIComponent(currentUserId));
    if (!data || !data.ok) { setStatus("価格の取得に失敗しました（" + ((data && data.error) || "応答なし") + "）。", false); return; }
    if (!data.triggerOn) {
      hideStatus();
      $("closed").classList.remove("hidden");
      return;
    }
    renderPrices(data);
    hideStatus();
    $("buy").classList.remove("hidden");
  }

  async function main() {
    // 決済からの戻り（LIFF不要・session_idだけで確定）
    const stage = getParam("stage");
    if (stage === "confirm") { return runConfirmStage(getParam("session_id")); }
    if (stage === "cancel")  { return runCancelStage(); }

    // 購入（選択）画面：動作中の exchange.html と同じ初期化フロー
    setStatus("LINEを起動しています…", true);
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isInClient()) { setStatus("LINEアプリの中で開いてください。", false); return; }
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

    const profile = await liff.getProfile();
    currentUserId = profile.userId || "";
    currentUserName = profile.displayName || "";
    if (!currentUserId) { setStatus("ユーザー情報を取得できませんでした。", false); return; }

    $("opt-pack").addEventListener("click", () => selectOpt("pack"));
    $("opt-bara").addEventListener("click", () => selectOpt("bara"));
    $("payBtn").addEventListener("click", goCheckout);

    await loadState();
  }

  main().catch((err) => { setStatus("エラー: " + (err && err.message || String(err)), false); });
</script>
</body>
</html>
