<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試飲チケット</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #FBF7EF; margin: 0; padding: 32px 16px 40px; color: #5a4632; }
    .wrap { max-width: 420px; margin: 0 auto; }
    .lead { text-align: center; margin-bottom: 26px; }
    .lead .icon { font-size: 40px; }
    h1 { font-size: 22px; font-weight: 700; margin: 8px 0 4px; }
    .lead .desc { font-size: 13px; color: #8c6e50; margin: 0; }
    .menu { display: flex; flex-direction: column; gap: 14px; }
    .card { display: block; text-decoration: none; border-radius: 14px; padding: 20px 18px; border: 1px solid #E0D2B8; }
    .card .t { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .card .s { font-size: 12px; margin: 6px 0 0 34px; opacity: 0.85; }
    .card .emoji { font-size: 22px; }
    .buy { background: #8a6d4b; border-color: #8a6d4b; color: #fff; }
    .buy .s { color: #f3ead9; }
    .hist { background: #fff; color: #34595A; }
    .hist .s { color: #7a9a9b; }
    .foot { text-align: center; font-size: 11px; color: #a08a6d; margin-top: 22px; line-height: 1.7; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="lead">
    <div class="icon">🎫</div>
    <h1>試飲チケット</h1>
    <p class="desc">どちらを開きますか？</p>
  </div>

  <div class="menu">
    <a class="card buy" href="https://liff.line.me/2008851980-trDQgLA1">
      <div class="t"><span class="emoji">🛒</span>チケットを買う</div>
      <div class="s">お店で一杯と交換できるチケットを購入します</div>
    </a>

    <a class="card hist" href="https://liff.line.me/2008851980-Ja5SU8nr">
      <div class="t"><span class="emoji">🕘</span>チケットの履歴</div>
      <div class="s">使える／使った／失効したチケットを確認します</div>
    </a>
  </div>

  <p class="foot">チケットはお店でチェックインしたときに使えます。<br>使い道が広がる旅を、ぜひお楽しみください。</p>
</div>
</body>
</html>
