<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<title>ロースターを探す｜JCJパスポート</title>
<style>
  :root{
    --cream:#faf5ee; --paper:#ffffff; --ink:#3a2f25; --sub:#8a7a68;
    --brown:#9f866a; --brown-d:#6f5b44; --accent:#c96f3f; --accent-d:#b45c2e;
    --line:#ece3d6; --sea:#eef2ef; --land:#e3d6bf; --land-has:#d9c39f; --land-line:#cdbb9f;
    --sel:#f0cdae; --pin:#c96f3f; --pin-dim:#d9c3b2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--cream);color:var(--ink);
    font-family:"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:24px}

  .status{color:var(--sub);font-size:14px;padding:60px 0;text-align:center}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none !important}

  .nudge{margin:14px 12px 0;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:9px;display:flex;gap:11px;align-items:center;box-shadow:0 4px 14px rgba(120,95,60,.09);position:relative}
  .nudge .kick{position:absolute;top:-8px;left:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 9px;border-radius:999px;letter-spacing:.03em}
  .nudge .pho{width:66px;height:66px;border-radius:11px;flex:none;background:linear-gradient(135deg,#c3a57c,#7c6448);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff8ee;font-size:22px}
  .nudge .pho img{width:100%;height:100%;object-fit:cover}
  .nudge .mid{flex:1;min-width:0}
  .nudge .say{font-size:11px;color:var(--accent-d);font-weight:700;margin-bottom:2px}
  .nudge .nm{font-size:14.5px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nudge .meta{font-size:11px;color:var(--sub);margin-top:2px}
  .nudge .go a{background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:9px 13px;border-radius:11px;text-decoration:none;white-space:nowrap;box-shadow:0 3px 9px rgba(180,92,46,.32);cursor:pointer}

  .sec-h{padding:16px 16px 2px;display:flex;align-items:flex-end;justify-content:space-between}
  .sec-h .h{font-weight:800;font-size:18px}
  .sec-h .c{font-size:11.5px;color:var(--sub);font-weight:700}

  .segbar{position:sticky;top:0;z-index:15;background:var(--cream);padding:9px 0 7px;box-shadow:0 4px 10px -6px rgba(120,95,60,.35)}
  .seg{margin:0 16px;background:#f0e7da;border-radius:12px;padding:3px;display:flex;position:relative}
  .seg button{flex:1;border:none;background:none;font-family:inherit;font-size:13px;font-weight:800;color:var(--sub);padding:9px 0;border-radius:9px;cursor:pointer;z-index:1}
  .seg button.on{color:var(--ink)}
  .seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--paper);border-radius:9px;box-shadow:0 2px 6px rgba(120,95,60,.14);transition:transform .22s ease}
  .seg.list .knob{transform:translateX(100%)}

  .filters{padding:11px 8px 3px}
  .frow{display:flex;gap:7px;overflow-x:auto;padding:2px 8px 8px;scrollbar-width:none}
  .frow::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--brown-d);font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .frow .lab{flex:none;align-self:center;font-size:10.5px;color:var(--sub);font-weight:700;padding-right:2px}

  .mapwrap{padding:6px 14px 14px}
  .mapcard{background:var(--sea);border:1px solid var(--line);border-radius:16px;padding:6px 6px 2px;position:relative}
  .legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:4px 0 6px;font-size:10.5px;color:var(--sub);font-weight:700}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .jp-map{width:100%;height:auto;display:block}
  .prefecture{fill:var(--land);stroke:var(--land-line);stroke-width:1.1px;stroke-linejoin:round;transition:fill .18s}
  .prefecture.has{fill:var(--land-has)}
  .prefecture.sel{fill:var(--sel)}
  .prefecture.dim{opacity:.42}
  .prefecture.lit{fill:var(--accent) !important;transition:fill .7s ease}
  .pin{fill:var(--pin);stroke:#fff;stroke-width:2px;cursor:pointer;transition:.15s}
  .pin.dim{fill:var(--pin-dim);opacity:.45}
  .pin.big{stroke-width:2.6px}
  .gauge{margin:2px 6px 6px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .gauge .top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--brown-d);margin-bottom:5px}
  .gauge .top b{color:var(--accent)}
  .gauge .bar{height:9px;border-radius:6px;background:#efe7da;overflow:hidden}
  .gauge .bar i{display:block;height:100%;background:var(--accent);border-radius:6px;width:0;transition:width .5s}

  .callout{position:absolute;left:10px;right:10px;bottom:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:none;gap:9px;align-items:center;box-shadow:0 6px 16px rgba(120,95,60,.16);z-index:5}
  .callout.show{display:flex}
  .callout .pho{width:44px;height:44px;border-radius:9px;flex:none;background:linear-gradient(135deg,#c3a57c,#7c6448);display:flex;align-items:center;justify-content:center;color:#fff8ee;font-size:16px;overflow:hidden}
  .callout .pho img{width:100%;height:100%;object-fit:cover}
  .callout .nm{font-size:13.5px;font-weight:800;line-height:1.2}
  .callout .meta{font-size:11px;color:var(--sub);margin-top:1px}
  .callout .go{margin-left:auto;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;padding:8px 12px;border-radius:9px;text-decoration:none;white-space:nowrap;cursor:pointer}

  .list{padding:8px 14px 18px;display:none;flex-direction:column;gap:10px}
  .list.show{display:flex}
  .prefhdr{font-size:11.5px;font-weight:800;color:var(--brown-d);padding:6px 2px 0;display:flex;align-items:center;gap:6px}
  .prefhdr b{background:#fbeee6;color:var(--accent-d);font-size:10.5px;padding:1px 8px;border-radius:999px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;cursor:pointer}
  .card .pho{width:176px;min-height:140px;flex:none;background:linear-gradient(135deg,#c3a57c,#7c6448);display:flex;align-items:center;justify-content:center;color:#fff8ee;font-size:28px;overflow:hidden}
  .card .pho img{width:100%;height:100%;object-fit:cover}
  .card .in{padding:10px 12px;flex:1;min-width:0}
  .card .pref{font-size:11px;color:var(--sub);font-weight:700}
  .card .nm{font-size:15px;font-weight:800;line-height:1.3;margin-top:1px}
  .card .ro{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px}
  .tag.b{background:#fbeee6;color:var(--accent-d)}
  .empty{padding:30px 20px;text-align:center;color:var(--sub);font-size:12.5px;display:none}
  .empty.show{display:block}

  .sheet{position:fixed;inset:0;background:rgba(28,21,15,.34);display:none;align-items:flex-end;z-index:40}
  .sheet.show{display:flex}
  .sheetcard{background:var(--cream);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;animation:up .24s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheetcard .hero{height:170px;background:linear-gradient(135deg,#c3a57c,#6f5b44);display:flex;align-items:center;justify-content:center;color:#fff8ee;font-size:40px;position:relative;overflow:hidden}
  .sheetcard .hero img{width:100%;height:100%;object-fit:cover}
  .sheetcard .x{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;border:none;font-size:16px;cursor:pointer;z-index:2}
  .sd{padding:14px 16px 24px}
  .sd .pref{font-size:11.5px;color:var(--sub);font-weight:700}
  .sd .nm{font-size:20px;font-weight:800;margin-top:2px}
  .sd .ro{font-size:12.5px;color:var(--sub);margin-top:2px}
  .sd .copy{font-size:12.5px;color:#5c4d3d;line-height:1.75;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:12px}
  .sd .go{display:block;text-align:center;text-decoration:none;margin-top:13px;height:52px;line-height:52px;border-radius:13px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 16px rgba(180,92,46,.3);cursor:pointer}
  .sd .subrow{display:flex;gap:9px;margin-top:10px}
  .sd .sub{flex:1;text-align:center;height:46px;line-height:44px;border-radius:11px;background:#fff;border:1.4px solid var(--brown);color:var(--brown-d);font-size:12.5px;font-weight:800;cursor:pointer;text-decoration:none}
  .sd .why{font-size:10.5px;color:var(--sub);text-align:center;margin-top:13px;line-height:1.6}

  .verbadge{position:fixed;right:8px;bottom:8px;background:rgba(58,47,37,.72);color:#fff8ee;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:60;pointer-events:none;letter-spacing:.02em}
  .toast{position:fixed;left:16px;right:16px;bottom:24px;max-width:448px;margin:0 auto;background:var(--ink);color:#fff8ee;font-size:12.5px;font-weight:700;line-height:1.5;padding:11px 14px;border-radius:12px;text-align:center;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:.97;transform:translateY(0)}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="wrap">

  <div id="status" class="status"><div class="spin"></div><div id="statusText">お店を読み込んでいます…</div></div>

  <div id="main" class="hidden">

    <div id="nudge" class="nudge hidden">
      <div class="kick">次の1軒</div>
      <div class="pho"><img id="nPhoto" alt="" onerror="this.style.display='none'"></div>
      <div class="mid">
        <div class="say" id="nSay">保存したお店、次はここが近いです</div>
        <div class="nm" id="nName">—</div>
        <div class="meta" id="nMeta">—</div>
      </div>
      <div class="go"><a id="nGo">見る</a></div>
    </div>

    <div class="sec-h"><div class="h">ロースターを探す</div><div class="c" id="count">—</div></div>

    <div class="segbar">
      <div class="seg" id="seg">
        <span class="knob"></span>
        <button class="on" id="segMap" onclick="setView('map')">🗺 地図</button>
        <button id="segList" onclick="setView('list')">☰ 一覧</button>
      </div>
    </div>

    <div class="filters">
      <div class="frow" id="areaRow"><span class="lab">エリア</span></div>
      <div class="frow"><span class="lab">こだわり</span>
        <button class="chip" data-tag="beans" onclick="setTag(this)">🫘 豆割あり</button>
      </div>
    </div>

    <div class="mapwrap" id="mapView">
      <div class="mapcard">
        <div class="legend"><span><i style="background:var(--land-has)"></i>店あり</span><span><i style="background:var(--land)"></i>お店がまだない</span><span><i style="background:var(--pin);border-radius:50%"></i>ロースター</span></div>

    {id:"S6",name:"京都寺町ロースター（例）",roaster:"スペシャルティ専門",pref:"京都府",area:"近畿",photo:"",mapUrl:"",web:"",ig:"",copy:"町家の奥で、静かな焙煎。",beans:1},
    {id:"S7",name:"博多の焙煎所（例）",roaster:"スペシャルティ専門",pref:"福岡県",area:"九州・沖縄",photo:"",mapUrl:"",web:"",ig:"",copy:"屋台の街の、朝の一杯。",beans:1},
    {id:"S8",name:"札幌の焙煎所（例）",roaster:"自家焙煎ロースター",pref:"北海道",area:"北海道・東北",photo:"",mapUrl:"",web:"",ig:"",copy:"雪の街の、深い香り。",beans:1},
    {id:"S9",name:"something like that",roaster:"自家焙煎ロースター",pref:"岡山県",area:"中国・四国",photo:"",mapUrl:"",web:"",ig:"",copy:"晴れの国の、澄んだ味わい。",beans:1},
    {id:"S10",name:"金沢の焙煎所（例）",roaster:"自家焙煎ロースター",pref:"石川県",area:"北陸",photo:"",mapUrl:"",web:"",ig:"",copy:"加賀の風情とともに。",beans:0},
    {id:"S11",name:"甲府の丘の珈琲（例）",roaster:"自家焙煎ロースター",pref:"山梨県",area:"甲信越",photo:"",mapUrl:"",web:"",ig:"",copy:"ぶどうの丘で味わう一杯。",beans:1},
    {id:"S12",name:"coffee etomoiri",roaster:"自家焙煎ロースター",pref:"沖縄県",area:"九州・沖縄",photo:"",mapUrl:"",web:"",ig:"",copy:"南の島の、ゆるやかな時間。",beans:1}
  ];

  var svg, pinsG, pinEls=[], SHOPS=[], byCode={}, prefEls={}, PREFCOUNT=0;
  var curArea="全国", curBeans=false, USER_ID="", IS_SAMPLE=false;

  function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},2800);}
  function photoInto(imgEl,url,box){ if(url){imgEl.src=url;imgEl.style.display="";} else {imgEl.style.display="none";} }

  function buildAreaChips(){
    var row=$("areaRow");
    var all=document.createElement("button");all.className="chip on";all.textContent="全国";all.dataset.area="全国";all.onclick=function(){setArea(all);};row.appendChild(all);
    AREAS.forEach(function(a){var b=document.createElement("button");b.className="chip";b.textContent=a;b.dataset.area=a;b.onclick=function(){setArea(b);};row.appendChild(b);});
  }

  function centroid(g){var sr=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,r=g.getBoundingClientRect();return {x:(r.left+r.width/2-sr.left)/sr.width*vb.width,y:(r.top+r.height/2-sr.top)/sr.height*vb.height};}

  // GPS正確な投影（地図SVGと同じ式）。経度→X（cos補正）、緯度→Y。
  var PROJ={lonMin:123.6602,latMax:45.5232,SX:52.4105,SY:52.4105,cosMid:Math.cos(34.8888*Math.PI/180),W:1000,H:1115};
  function projPin(lng,lat){ return { x:(lng-PROJ.lonMin)*PROJ.cosMid*PROJ.SX, y:(PROJ.latMax-lat)*PROJ.SY }; }

  function buildMap(){
    svg=document.querySelector(".jp-map");
    byCode={};SHOPS.forEach(function(s,i){s.idx=i;s.code=PREF2CODE[s.pref];if(s.code){(byCode[s.code]=byCode[s.code]||[]).push(s);}});
    [].forEach.call(svg.querySelectorAll(".prefecture"),function(g){
      var code=+g.getAttribute("data-code");prefEls[code]=g;
      if(byCode[code])g.classList.add("has");
      g.style.cursor="pointer";g.addEventListener("click",function(){onPref(code);});
    });
    // ピンを実座標(緯度経度)で地図と同じ投影で配置＝街の上に正しく乗る
    pinsG=document.createElementNS("http://www.w3.org/2000/svg","g");svg.appendChild(pinsG);pinEls=[];
    Object.keys(byCode).forEach(function(code){
      code=+code;var arr=byCode[code];var placed=[];
      arr.forEach(function(s,k){
        var x,y;
        if(s.lat!=null&&s.lng!=null){ var p=projPin(s.lng,s.lat); x=p.x; y=p.y; }
        else { var c; try{c=centroid(prefEls[code]);}catch(e){c={x:PROJ.W/2,y:PROJ.H/2};} x=c.x;y=c.y; if(arr.length>1){var a0=(k/arr.length)*6.283;x+=Math.cos(a0)*12;y+=Math.sin(a0)*12;} }
        // 同じ地点で重なるピンだけ少しずらす（実座標はできるだけ保つ）
        var bump=0;placed.forEach(function(pp){var dx=x-pp[0],dy=y-pp[1];if(dx*dx+dy*dy<121)bump++;});
        if(bump>0){var a=bump*2.399;x+=Math.cos(a)*10;y+=Math.sin(a)*10;}
        x=Math.max(6,Math.min(PROJ.W-6,x));y=Math.max(6,Math.min(PROJ.H-6,y));
        placed.push([x,y]);
        var el=document.createElementNS("http://www.w3.org/2000/svg","circle");
        el.setAttribute("cx",x);el.setAttribute("cy",y);
        el.setAttribute("r",7);el.setAttribute("class","pin");el.dataset.i=s.idx;
        el.addEventListener("click",function(ev){ev.stopPropagation();onPin(s.idx);});
        pinsG.appendChild(el);pinEls.push(el);
      });
    });
  }

  function regionOK(s){return curArea==="全国"||s.area===curArea;}
  function shopOK(s){return regionOK(s)&&(!curBeans||s.beans===1);}

  function onPin(i){
    var s=SHOPS[i];
    photoInto($("coPhoto"),s.photo);
    $("coName").textContent=s.name;$("coMeta").textContent=s.pref;
    $("coGo").textContent="見る";$("coGo").onclick=function(){openSheet(i);};
    $("callout").classList.add("show");
    pinEls.forEach(function(c){c.classList.toggle("big",+c.dataset.i===i);});
  }
  function onPref(code){
    [].forEach.call(svg.querySelectorAll(".prefecture"),function(g){g.classList.remove("sel");});
    prefEls[code].classList.add("sel");
    var arr=(byCode[code]||[]).filter(shopOK);
    $("coPhoto").style.display="none";
    if(arr.length){$("coName").textContent=FN(code);$("coMeta").textContent=arr.length+"店 ／ 例："+arr[0].name;$("coGo").textContent="一覧で見る";$("coGo").onclick=function(){setView("list");};}
    else{$("coName").textContent=FN(code)+"（お店がまだない県）";$("coMeta").textContent="まだお店がありません。あなたの推薦で最初の1軒を灯せます";$("coGo").textContent="この県を推薦する";$("coGo").onclick=function(){prefEls[code].classList.add("lit");$("callout").classList.remove("show");toast("推薦ありがとうございます！最初の1軒が採用されると、この県が灯ります。");};}
    $("callout").classList.add("show");
  }

  window.setArea=function(el){curArea=el.dataset.area;[].forEach.call(el.parentNode.querySelectorAll(".chip"),function(c){c.classList.remove("on");});el.classList.add("on");refresh();};
  window.setTag=function(el){curBeans=!curBeans;el.classList.toggle("on",curBeans);refresh();};
  window.setView=function(v){
    $("segMap").classList.toggle("on",v==="map");$("segList").classList.toggle("on",v==="list");
    $("seg").classList.toggle("list",v==="list");
    $("mapView").style.display=(v==="map")?"block":"none";
    $("listView").classList.toggle("show",v==="list");
    if(v==="list")renderList();
  };

  function tagHTML(s){return s.beans===1?'<span class="tag b">🫘 豆割あり</span>':"";}
  function ph(s){return s.photo?'<img src="'+s.photo+'" alt="" onerror="this.style.display=\'none\'">':"☕";}
  function cardHTML(s){
    return '<div class="card" onclick="openSheet('+s.idx+')"><div class="pho">'+ph(s)+'</div><div class="in">'+
      '<div class="pref">'+s.pref+'</div><div class="nm">'+s.name+'</div>'+
      '<div class="ro">'+(s.roaster||"")+'</div><div class="tags">'+tagHTML(s)+'</div></div></div>';
  }
  function renderList(){
    var wrap=$("listView"),out="",arr=SHOPS.filter(shopOK);
    var codes=[];arr.forEach(function(s){if(s.code&&codes.indexOf(s.code)<0)codes.push(s.code);});
    codes.sort(function(a,b){return a-b;});
    codes.forEach(function(code){
      var g=arr.filter(function(s){return s.code===code;});
      out+='<div class="prefhdr">'+FN(code)+' <b>'+g.length+'店</b></div>';
      g.forEach(function(s){out+=cardHTML(s);});
    });
    wrap.innerHTML=out;
    $("emptyView").classList.toggle("show",arr.length===0);
  }

  window.openSheet=function(i){
    var s=SHOPS[i];
    photoInto($("sdPhoto"),s.photo);
    $("sdPref").textContent=s.pref;$("sdName").textContent=s.name;$("sdRo").textContent=s.roaster||"";
    if(s.copy){$("sdCopy").textContent=s.copy;$("sdCopy").classList.remove("hidden");}else{$("sdCopy").classList.add("hidden");}
    if(s.mapUrl){$("sdGo").href=s.mapUrl;$("sdGo").style.display="";}else{$("sdGo").removeAttribute("href");$("sdGo").style.display=IS_SAMPLE?"":"none";}
    $("sdShare").onclick=function(){ if(s.id){location.href="https://liff.line.me/"+SHARE_LIFF_ID+"?shopId="+encodeURIComponent(s.id)+"&source=discover_map";} };
    $("sdSave").onclick=function(){ toast("「行きたい」に保存しました（デモ）"); };
    $("sheet").classList.add("show");
  };
  window.closeSheet=function(){$("sheet").classList.remove("show");};

  function refresh(){
    var n=0;
    pinEls.forEach(function(c){var s=SHOPS[+c.dataset.i];var ok=shopOK(s);c.classList.toggle("dim",!ok);if(ok)n++;});
    [].forEach.call(svg.querySelectorAll(".prefecture"),function(g){var code=+g.getAttribute("data-code");g.classList.toggle("dim",curArea!=="全国"&&CODE2AREA[code]!==curArea);});
    var pc={};SHOPS.filter(shopOK).forEach(function(s){if(s.code)pc[s.code]=1;});
    $("count").textContent="全"+n+"店・"+Object.keys(pc).length+"県";
    $("callout").classList.remove("show");
    if($("listView").classList.contains("show"))renderList();
  }

  function setGauge(){$("gPref").textContent=PREFCOUNT;$("gBar").style.width=Math.round(PREFCOUNT/47*100)+"%";}

  function showNudgeFrom(t,isDemo){
    if(!t){$("nudge").classList.add("hidden");return;}
    photoInto($("nPhoto"),t.photo);
    $("nName").textContent=t.name;
    $("nMeta").textContent=(t.pref||"")+(t.distanceKm!=null?" ／ 約 "+t.distanceKm+"km":"");
    $("nSay").textContent=isDemo?"（LINEで開くと、あなたの保存店が入ります）":"保存したお店、次はここが近いです";
    $("nGo").onclick=function(){ if(t.mapUrl){window.open(t.mapUrl,"_blank");} else {var i=SHOPS.findIndex(function(s){return s.id===t.shopId||s.id===t.id;});if(i>=0)openSheet(i);} };
    $("nudge").classList.remove("hidden");
  }

  function renderAll(){
    buildAreaChips();
    $("status").classList.add("hidden");$("main").classList.remove("hidden");
    buildMap();setGauge();refresh();
  }

  async function loadShops(){
    try{
      const res=await fetch(GAS_URL+"?action=discover_shops&_="+Date.now());
      const d=await res.json();
      if(d&&d.ok&&d.shops&&d.shops.length){ SHOPS=d.shops; PREFCOUNT=d.prefCount||0; IS_SAMPLE=false; return; }
      throw new Error("empty");
    }catch(e){
      SHOPS=SAMPLE; IS_SAMPLE=true;
      var pc={};SHOPS.forEach(function(s){pc[s.pref]=1;});PREFCOUNT=Object.keys(pc).length;
    }
  }

  async function loadNudge(){
    try{
      if(!USER_ID) throw new Error("no-user");
      const res=await fetch(GAS_URL+"?action=saved_nudge&userId="+encodeURIComponent(USER_ID)+"&_="+Date.now());
      const d=await res.json();
      if(d&&d.ok&&d.target){ showNudgeFrom(d.target,false); return; }
      $("nudge").classList.add("hidden");
    }catch(e){
      // プレビュー（LINE外・未ログイン）＝先頭店でお知らせ箱の"見た目"だけ見せる（本番LINEでは本人の保存店に置換）
      if(SHOPS.length){ showNudgeFrom(SHOPS[0],true); } else { $("nudge").classList.add("hidden"); }
    }
  }

  async function initLiff(){
    try{
      if(!/^\d+-/.test(LIFF_ID)||LIFF_ID.indexOf("XXXXXXXX")>=0) return; // 未発行なら飛ばす（LINE外プレビューでも地図は動く）
      await liff.init({liffId:LIFF_ID});
      if(liff.isLoggedIn()){ const p=await liff.getProfile(); USER_ID=p.userId||""; }
    }catch(e){ /* LINE外・未設定でも地図は出す */ }
  }

  async function main(){
    await initLiff();
    await loadShops();
    renderAll();
    await loadNudge();
  }
  main().catch(function(err){ $("statusText").textContent="読み込みに失敗しました。時間をおいてお試しください。"; $("spin").classList.add("hidden"); });
</script>
